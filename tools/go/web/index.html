<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="family.css">
<style>
/* One narrow column. Home: your mistakes by kind (from KataGo's look at your games), the drills, heuristics.
   A session: one position at a time on a board you click. */
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.top a, .back { color: var(--muted); text-decoration: none; font-size: 14px; background: none; border: 0; cursor: pointer; padding: 0; justify-self: start }
h1 { font-size: clamp(32px, 6vw, 48px) }
h2 { font-size: 20px; margin: 0 }
section { display: grid; gap: 10px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row > .grow { flex: 1 }
.stats { display: flex; gap: 12px; flex-wrap: wrap }
.stat { background: var(--raised); border-radius: var(--r-md); padding: 12px 16px; min-width: 96px }
.stat b { display: block; font-family: var(--display); font-size: 28px }
.stat span, .meta, small { color: var(--muted); font-size: 14px }
ul { list-style: none; margin: 0; padding: 0 }
li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px }
li .what { display: grid; gap: 4px; min-width: 0; flex: 1 }
.bar { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ember) }
.chip { font-size: 12px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--raised); white-space: nowrap }
.chip.due { background: var(--pool); color: var(--on-accent) }
.status { color: var(--muted); font-size: 14px; min-height: 1.4em }
details > summary { cursor: pointer; color: var(--pool) }
.tips { display: grid; gap: 10px; margin: 10px 0 0; padding-left: 20px; list-style: decimal }
.tips li { display: list-item; border: 0; padding: 0 }
/* A drill */
.drill { display: grid; gap: 12px }
.prompt { font-size: 18px }
.board { width: 100%; max-width: 480px; justify-self: center; touch-action: manipulation; user-select: none }
.board .pt { cursor: pointer }
.answer { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px }
.right { color: var(--leaf); font-weight: 600 }
.wrong { color: var(--ember); font-weight: 600 }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.grades button { padding: 12px 4px }
.grades .again { background: var(--ember); color: var(--on-accent) }
.grades .good { background: var(--leaf); color: var(--on-accent) }
.grades .pick { outline: 3px solid var(--sun) }
.guess { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center }
.guess input { width: 90px; background: var(--raised); border: 1.5px solid transparent; border-radius: var(--r-sm); padding: 9px 12px; color: var(--ink); font: inherit; text-align: center }
.guess input:focus { border-color: var(--pool); outline: none }
.seg button { border-radius: 0; padding: 9px 14px }
.seg button:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill) }
.seg button:last-child { border-radius: 0 var(--r-pill) var(--r-pill) 0 }
.seg .on { background: var(--pool); color: var(--on-accent) }
.train { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: grid; gap: 10px }
.train .rule { font-family: var(--display); font-size: 20px }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
.chart h3 { font-size: 15px; margin: 0 0 4px }
.chart svg { width: 100%; height: auto; overflow: visible }
.chart .hit { fill: transparent; cursor: default }
table.weeks { border-collapse: collapse; font-size: 14px; width: 100% }
table.weeks th, table.weeks td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line) }
table.weeks th:first-child, table.weeks td:first-child { text-align: left }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; justify-content: center }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend svg { width: 20px; height: 20px }
.explore { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px }
.explore .on { background: var(--pool); color: var(--on-accent) }
.steps button { min-width: 44px; padding: 8px 10px }
.progress { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden }
.progress i { display: block; height: 100%; background: var(--sun) }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><a href="https://dot-y.co/">← dot-y.co</a><button class="btn ghost" id="signout" hidden>Sign out</button></div>
  <h1>Go</h1>
  <div id="main"><p class="status">Loading…</p></div>
</div>
<script src="rules.js"></script>
<script src="family-auth.js"></script>
<script>
(function () {
  var R = window.GoRules, cfg, data = {}, session = null;
  var main = document.getElementById("main");
  var GTP = "ABCDEFGHJKLMNOPQRST";
  // The kinds of mistake (scripts/classify.mjs), what each one means, and what to do instead
  var THEMES = {
    ignored_threat: ["Ignored a threat", "Their last move threatened something big, and you played elsewhere. Before every move: what does their last move threaten?"],
    lost_stones: ["Let stones die", "This move let stones be cut off or killed. Check your weak groups’ liberties and cutting points before playing elsewhere."],
    missed_kill: ["Missed a kill", "Their stones were dead with the right move, and they lived. When a group looks thin, look for the kill first."],
    needless_answer: ["Answered when you could tenuki", "Nothing here needed an answer: you played gote. The biggest point elsewhere was worth more."],
    key_point: ["Missed the key point", "The point between your stones and theirs decided which group was weak, and you played elsewhere."],
    endgame: ["Endgame order", "A smaller endgame move, or the right one in the wrong order. Sente moves first, then the biggest gote."],
    wrong_area: ["Played in the wrong area", "The biggest move was somewhere else on the board. Before playing locally, look at the whole board."],
    local_shape: ["Right area, wrong move", "You found the right place, but not the right move: shape and reading."],
  };
  var KIND = { fix: "Fix the move", threat: "Find the threat", count: "Who’s ahead?", tsumego: "Life and death" };
  var HEURISTICS = [
    "Before every move, ask what their last move threatens. Answer it, or know why you don’t have to.",
    "Before you answer, ask: if I play elsewhere, what do I lose? If it’s small, tenuki: you keep sente.",
    "Count at two moments: when the borders first form (around move 20) and before the endgame. Ahead: simplify and protect your weaknesses. Behind: look for a fight while there’s still room.",
    "Look at the weakest group on the board first: yours (save or settle it) or theirs (attack it). On 9x9, the fight decides the game.",
    "Cutting points first: find every place your stones can be cut, and every place theirs can.",
    "Sente moves first in the endgame, then the biggest gote. A gote move must be worth more than the biggest move elsewhere.",
    "Don’t play a move you already know is answered: a hane that just gets blocked hands them the next move.",
    "When it’s unclear, play the move that makes your group strong. Strong groups let you fight anywhere.",
  ];
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  function status(msg) { var s = document.getElementById("status"); if (s) s.textContent = msg || ""; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function pt(i, size) { return i < 0 ? "pass" : GTP[i % size] + (size - Math.floor(i / size)); }
  function colorName(c) { return c === "b" ? "Black" : "White"; }
  function signedLead(x) { x = Math.round(x * 2) / 2; return x === 0 ? "even" : (x > 0 ? "Black" : "White") + " by " + Math.abs(x); }

  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method,
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (j) {
        if (!res.ok) { var e = new Error(j.error || ("error " + res.status)); e.status = res.status; throw e; }
        return j;
      });
    });
  }
  function fail(e) { status("Couldn’t do that: " + e.message); }

  // ---- home ----
  function home() {
    session = null;
    return api("GET", "/summary").then(function (s) {
      data.summary = s;
      return s.plan ? api("GET", "/today").then(function (t) { data.today = t; }) : (data.today = null);
    }).then(renderHome);
  }
  function due(t) { return t ? t.due + t.new : 0; }
  function renderHome() {
    var s = data.summary, p = s.profile, k = s.kinds;
    var mistakes = "";
    if (p) {
      var kinds = Object.keys(p.byKind).filter(function (x) { return p.byKind[x].n; }).sort(function (a, b) { return p.byKind[b].points - p.byKind[a].points; });
      var top = kinds.length ? p.byKind[kinds[0]].points : 1;
      mistakes = '<section><h2>Your mistakes</h2><p class="meta">From KataGo’s look at your last ' + plural(p.games, "9x9 game") + ": each move that lost 3 points or more, by kind, biggest cost first.</p><ul>" +
        kinds.map(function (x) {
          var m = p.byKind[x], t = s.themes[x], th = THEMES[x] || [x, ""], w = s.week.themes[x];
          return '<li><div class="what"><strong>' + esc(th[0]) + "</strong><small>" + (m.n / p.games).toFixed(1) + " a game · " + (m.points / p.games).toFixed(1) + " points a game" +
            (w && w.n ? " · this week " + (w.n - w.miss) + " of " + w.n + " right" : "") + '</small><div class="bar"><i style="width:' + Math.round(100 * m.points / top) + '%"></i></div></div>' +
            (t ? '<div class="row">' + (t.due ? '<span class="chip due">' + t.due + " due</span>" : "") + '<button class="btn ghost" data-study="fix" data-theme="' + esc(x) + '">Drill</button></div>' : "") + "</li>";
        }).join("") + "</ul></section>";
    }
    var drills = ["threat", "count", "tsumego", "fix"].filter(function (x) { return k[x] && k[x].total; }).map(function (x) {
      var t = k[x], w = s.week.kinds[x];
      var note = x === "count" && w && w.n ? " · this week off by " + (w.err / w.n).toFixed(1) + " on average" : w && w.n ? " · this week " + (w.n - w.miss) + " of " + w.n + " right" : "";
      return '<li><div class="what"><strong>' + KIND[x] + (x === "fix" ? ": everything" : "") + "</strong><small>" + plural(t.total, "position") + (t.new ? " · " + t.new + " new" : "") + note + "</small></div>" +
        '<div class="row">' + (t.due ? '<span class="chip due">' + t.due + " due</span>" : "") + '<button class="btn ghost" data-study="' + x + '">Drill</button></div></li>';
    }).join("");
    main.innerHTML = training(s) +
      '<div class="stats"><div class="stat"><b>' + s.today.n + '</b><span>drilled today</span></div><div class="stat"><b>' + s.streak + "</b><span>" + (s.streak === 1 ? "day" : "days") + ' in a row</span></div>' +
        '<div class="stat"><b>' + s.today.minutes + "</b><span>minutes today</span></div></div>" +
      mistakes + realGames(s) +
      "<section><h2>Drills</h2>" + (drills ? "<ul>" + drills + "</ul>" : '<p class="meta">No drills yet: they’re made from your games by the scripts in tools/go/scripts.</p>') + "</section>" +
      '<section><details><summary>Heuristics to play by</summary><ol class="tips">' + HEURISTICS.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ol></details></section>" +
      '<p class="status" id="status"></p>';
  }

  // ---- the training program: one focus at a time, a session a day (api/plan.mjs) ----
  function training(s) {
    var p = s.plan;
    if (!p) {
      if (!s.profile) return "";
      var order = Object.keys(s.profile.byKind).filter(function (k) { return s.profile.byKind[k].points > 0 && THEMES[k]; })
        .sort(function (a, b) { return s.profile.byKind[b].points - s.profile.byKind[a].points; });
      return '<section class="train"><h2>Training</h2><p>One focus at a time, in the order your mistakes cost you, and about 20 minutes a day: a life-and-death warm-up, your focus, counting, and anything due.</p>' +
        '<p class="meta">First: ' + esc(THEMES[order[0]][0]) + (order.length > 1 ? ". Then " + order.slice(1, 4).map(function (k) { return esc(THEMES[k][0]).toLowerCase(); }).join(", ") + "." : ".") + "</p>" +
        '<div class="row"><button class="btn primary" data-plan="start">Start the program</button></div></section>';
    }
    var t = data.today, prog = t && t.progress, upcoming = p.order[p.at + 1];
    return '<section class="train"><div class="row"><h2 class="grow">Focus ' + (p.at + 1) + " of " + p.order.length + ": " + esc(THEMES[p.focus] ? THEMES[p.focus][0] : p.focus) + "</h2></div>" +
      '<p class="rule">' + esc(p.heuristic) + "</p>" +
      (prog ? '<p class="meta">Day ' + (prog.days + 1) + " · " + plural(prog.n, "focus drill") + (prog.n ? ", " + Math.round(prog.right * 100) + "% right" : "") + " · life and death at level " + p.level + "</p>" : "") +
      (prog && prog.ready && upcoming ? '<p><strong>Ready to move on.</strong> A week in, and the drills are mostly right. Check your real games below too.</p>' : "") +
      '<div class="row">' + (t && t.left ? '<button class="btn primary" data-today>Today’s training · ' + t.left + " left</button>" : '<span class="right">Today’s training is done.</span>') +
        (upcoming ? '<button class="btn ghost" data-plan="next">' + (prog && prog.ready ? "Move on to " : "Skip to ") + esc(THEMES[upcoming] ? THEMES[upcoming][0] : upcoming).toLowerCase() + "</button>" : "") + "</div></section>";
  }
  function startPlan() {
    return api("POST", "/plan", { action: "start" }).then(function () { return home(); }).catch(fail);
  }
  function nextFocus() {
    var p = data.summary.plan;
    if (!(data.today && data.today.progress && data.today.progress.ready) && !confirm("Skip ahead before this focus is done?")) return;
    return api("POST", "/plan", { action: "next", rev: p.rev }).then(function () { return home(); }).catch(fail);
  }
  function startToday() {
    return api("GET", "/today").then(function (t) {
      var queue = [];
      [["warmup", "Warm-up"], ["focus", "Focus"], ["count", "Counting"], ["review", "Review"]].forEach(function (sec) {
        (t.sections[sec[0]] || []).forEach(function (d) { d._section = sec[1]; queue.push(d); });
      });
      if (!queue.length) { status("Today’s training is done."); return; }
      session = { kind: "today", queue: queue, at: 0, done: 0, right: 0, again: [] };
      next();
    }).catch(fail);
  }

  // ---- his real games, week by week: points lost a game (one line a chart; hover a point for its week) ----
  function weekly(s, kind) {
    return s.weeks.filter(function (w) { return w.games; }).map(function (w) {
      var pts = 0;
      Object.keys(w.byKind).forEach(function (k) { if (!kind || k === kind) pts += w.byKind[k].points; });
      return { week: w.week, games: w.games, v: pts / w.games };
    });
  }
  function lineChart(title, rows, startWeek) {
    var W = 300, H = 130, L = 30, B = 22, T = 8, R = 8, max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.v); });
    max = Math.ceil(max / 5) * 5;
    var x = function (i) { return L + (rows.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (rows.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(title) + '">';
    [0, max / 2, max].forEach(function (g) {
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + Math.round(g) + "</text>";
    });
    var start = -1;
    rows.forEach(function (r, i) { if (startWeek && start < 0 && r.week >= startWeek) start = i; });
    if (start >= 0) out += '<line x1="' + x(start) + '" x2="' + x(start) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="' + (x(start) + 4) + '" y="' + (T + 10) + '" font-size="10" fill="var(--muted)">training</text>';
    out += '<polyline fill="none" stroke="var(--ember)" stroke-width="2" stroke-linejoin="round" points="' + rows.map(function (r, i) { return x(i) + "," + y(r.v); }).join(" ") + '"/>';
    rows.forEach(function (r, i) {
      out += '<circle cx="' + x(i) + '" cy="' + y(r.v) + '" r="4" fill="var(--ember)" stroke="var(--surface)" stroke-width="2"/>' +
        '<circle class="hit" cx="' + x(i) + '" cy="' + y(r.v) + '" r="12"><title>Week of ' + r.week + ": " + r.v.toFixed(1) + " points a game (" + plural(r.games, "game") + ")</title></circle>";
    });
    if (rows.length) out += '<text x="' + x(0) + '" y="' + (H - 6) + '" font-size="10" fill="var(--muted)">' + rows[0].week.slice(5) + '</text><text x="' + x(rows.length - 1) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + rows[rows.length - 1].week.slice(5) + "</text>";
    return '<div class="chart"><h3>' + esc(title) + "</h3>" + out + "</svg></div>";
  }
  function realGames(s) {
    if (!s.weeks || !s.weeks.length) return "";
    var focus = s.plan && s.plan.focus, start = s.plan && (s.plan.history[0] ? s.plan.history[0].startedAt : s.plan.startedAt).slice(0, 10);
    var all = weekly(s), mine = focus ? weekly(s, focus) : null;
    return '<section><h2>Your real games</h2><p class="meta">Points lost a game to mistakes of 3 points or more, week by week. This is the test that counts: drills only help if these go down.</p><div class="charts">' +
      (mine ? lineChart((THEMES[focus] ? THEMES[focus][0] : focus) + ": points a game", mine, start) : "") + lineChart("All mistakes: points a game", all, start) + "</div>" +
      '<details><summary>As a table</summary><table class="weeks"><tr><th>Week of</th><th>Games</th>' + (mine ? "<th>" + esc(THEMES[focus][0]) + "</th>" : "") + "<th>All</th></tr>" +
        all.map(function (r, i) { return "<tr><td>" + r.week + "</td><td>" + r.games + "</td>" + (mine ? "<td>" + mine[i].v.toFixed(1) + "</td>" : "") + "<td>" + r.v.toFixed(1) + "</td></tr>"; }).join("") + "</table></details></section>";
  }

  // ---- the board: an SVG of the whole board, or the corner a problem is in ----
  // marks: { <point>: "best" | "played" | "pick" | "follow" }, own: ownership (-100..100, Black's side) to shade
  function boardSvg(d, board, opts) {
    opts = opts || {};
    var size = d.size, c = d.crop || [0, 0, size - 1, size - 1], S = 40, M = 30;
    var w = (c[2] - c[0]) * S + 2 * M, h = (c[3] - c[1]) * S + 2 * M;
    var X = function (x) { return M + (x - c[0]) * S; }, Y = function (y) { return M + (y - c[1]) * S; };
    var out = '<svg class="board" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="Go board"><rect width="' + w + '" height="' + h + '" rx="8" fill="var(--sun)" opacity=".55"/>';
    for (var x = c[0]; x <= c[2]; x++) out += '<line x1="' + X(x) + '" y1="' + (c[1] === 0 ? Y(0) : 0) + '" x2="' + X(x) + '" y2="' + (c[3] === size - 1 ? Y(size - 1) : h) + '" stroke="var(--wood)" stroke-width="1"/>';
    for (var y = c[1]; y <= c[3]; y++) out += '<line y1="' + Y(y) + '" x1="' + (c[0] === 0 ? X(0) : 0) + '" y2="' + Y(y) + '" x2="' + (c[2] === size - 1 ? X(size - 1) : w) + '" stroke="var(--wood)" stroke-width="1"/>';
    if (size === 9) [[2, 2], [6, 2], [4, 4], [2, 6], [6, 6]].forEach(function (s) { out += '<circle cx="' + X(s[0]) + '" cy="' + Y(s[1]) + '" r="3" fill="var(--wood)"/>'; });
    if (!d.crop) for (var k = 0; k < size; k++) {
      out += '<text x="' + X(k) + '" y="14" text-anchor="middle" font-size="11" fill="var(--muted)">' + GTP[k] + '</text><text x="10" y="' + (Y(k) + 4) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (size - k) + "</text>";
    }
    for (y = c[1]; y <= c[3]; y++) for (x = c[0]; x <= c[2]; x++) {
      var i = y * size + x, v = board[i], m = opts.marks && opts.marks[i];
      if (opts.own) {
        var o = opts.own[i] / 100;
        if (Math.abs(o) > 0.2) out += '<rect x="' + (X(x) - 11) + '" y="' + (Y(y) - 11) + '" width="22" height="22" rx="3" fill="' + (o > 0 ? "var(--ink)" : "var(--surface)") + '" opacity="' + (Math.abs(o) * 0.55).toFixed(2) + '"/>';
      }
      if (v) out += '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="18" fill="' + (v === 1 ? "var(--ink)" : "var(--surface)") + '" stroke="var(--ink)" stroke-width="1"/>';
      if (opts.numbers && opts.numbers[i] && v) out += '<text x="' + X(x) + '" y="' + (Y(y) + 5) + '" text-anchor="middle" font-size="15" font-weight="600" fill="' + (v === 1 ? "var(--surface)" : "var(--ink)") + '">' + opts.numbers[i] + "</text>";
      else if (i === (opts.last != null ? opts.last : d.last) && v) out += '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="7" fill="none" stroke="' + (v === 1 ? "var(--surface)" : "var(--ink)") + '" stroke-width="2"/>';
      if (m === "best" || m === "follow") out += '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="13" fill="none" stroke="var(--leaf)" stroke-width="4"/>';
      if (m === "played") out += '<path d="M' + (X(x) - 9) + " " + (Y(y) - 9) + " L" + (X(x) + 9) + " " + (Y(y) + 9) + " M" + (X(x) + 9) + " " + (Y(y) - 9) + " L" + (X(x) - 9) + " " + (Y(y) + 9) + '" stroke="var(--ember)" stroke-width="4" stroke-linecap="round"/>';
      if (m === "pick") out += '<circle cx="' + X(x) + '" cy="' + Y(y) + '" r="8" fill="var(--pool)"/>';
      if (opts.clickable && !v) out += '<rect class="pt" data-pt="' + i + '" x="' + (X(x) - S / 2) + '" y="' + (Y(y) - S / 2) + '" width="' + S + '" height="' + S + '" fill="transparent"/>';
    }
    return out + "</svg>";
  }
  function boardOf(d) { return d.stones.split("").map(Number); }

  // ---- a session ----
  function study(kind, theme) {
    var q = "/study?kind=" + kind + (theme ? "&theme=" + encodeURIComponent(theme) : "");
    return api("GET", q).then(function (r) {
      var queue = r.due.concat(r.new);
      if (!queue.length) { status("Nothing due here right now."); return; }
      session = { kind: kind, theme: theme, queue: queue, at: 0, done: 0, right: 0, again: [] };
      next();
    }).catch(fail);
  }
  function next() {
    var s = session;
    if (s.at >= s.queue.length) {
      // Missed ones come round once more before the session ends
      if (s.again.length) { s.queue = s.queue.concat(s.again); s.again = []; }
      else return finish();
    }
    s.cur = { d: s.queue[s.at], start: Date.now(), board: boardOf(s.queue[s.at]), last: s.queue[s.at].last, picked: null, answered: false };
    // A problem's tree comes as JSON text (it can nest deeper than the table allows)
    if (typeof s.cur.d.tree === "string") s.cur.d.tree = JSON.parse(s.cur.d.tree);
    if (s.cur.d.kind === "tsumego") { s.cur.node = s.cur.d.tree; s.cur.player = s.cur.d.toMove === "b" ? 1 : 2; }
    if (s.cur.d.kind === "count") s.cur.side = null;
    renderDrill();
  }
  function finish() {
    var s = session;
    main.innerHTML = '<div class="drill"><h2>' + (s.kind === "today" ? "That’s today’s training" : "Done") + "</h2><p>" + s.right + " of " + s.done + ' right the first time.</p><div class="row"><button class="btn primary" data-home>Back to Go</button></div></div>';
  }
  function promptFor(d) {
    var who = colorName(d.toMove), src = d.mine ? "In your game" : "In a game at your level";
    if (d.kind === "fix") return "<strong>" + who + " to play.</strong> " + src + ", " + who + " played a move here that lost " + d.loss + " points. Find a better one.";
    if (d.kind === "threat") return "<strong>" + colorName(d.toMove === "b" ? "w" : "b") + " just played the marked stone.</strong> If " + who + " ignored it, where would " + colorName(d.toMove === "b" ? "w" : "b") + " play next? Click the threat.";
    if (d.kind === "count") return "<strong>" + who + " to play. Komi " + d.komi + ".</strong> Who’s ahead, and by how much (with komi)?";
    return "<strong>" + who + " to play.</strong> " + esc(d.prompt || "Solve it.");
  }
  // What the marks on the board mean, for the ones this drill shows
  var SWATCH = {
    best: '<circle cx="10" cy="10" r="7" fill="none" stroke="var(--leaf)" stroke-width="3"/>',
    played: '<path d="M5 5 L15 15 M15 5 L5 15" stroke="var(--ember)" stroke-width="3" stroke-linecap="round"/>',
    pick: '<circle cx="10" cy="10" r="5" fill="var(--pool)"/>',
    last: '<circle cx="10" cy="10" r="9" fill="var(--ink)"/><circle cx="10" cy="10" r="4" fill="none" stroke="var(--surface)" stroke-width="1.5"/>',
  };
  function legend(d, cur) {
    var items = [];
    if (d.kind === "fix") items.push(["best", "KataGo’s best"], ["played", "The game move"]);
    if (d.kind === "threat") items.push(["best", "The threat"]);
    if (cur.picked != null && cur.picked !== d.played && (d.answers || []).indexOf(cur.picked) < 0) items.push(["pick", "Your move"]);
    if (d.last >= 0) items.push(["last", "The last move"]);
    return '<div class="legend">' + items.map(function (x) { return '<span><svg viewBox="0 0 20 20" aria-hidden="true">' + SWATCH[x[0]] + "</svg>" + x[1] + "</span>"; }).join("") + "</div>";
  }
  function renderDrill() {
    var s = session, cur = s.cur, d = cur.d;
    var n = s.queue.length, pct = Math.round(100 * s.at / n);
    var marks = {}, own = null, feedback = cur.answered ? cur.feedback + explorePanel() : "";
    var ex = cur.answered && cur.ex.pos > 0 ? played(cur) : null;
    var key = cur.answered && !ex && d.kind !== "count" ? legend(d, cur) : "";
    if (cur.answered && d.kind === "fix") { (d.answers || []).forEach(function (a) { marks[a] = "best"; }); marks[d.played] = "played"; }
    if (cur.answered && d.kind === "threat") (d.answers || []).forEach(function (a) { marks[a] = "follow"; });
    if (cur.picked != null && !marks[cur.picked]) marks[cur.picked] = "pick";
    if (cur.answered && d.kind === "count") own = d.own;
    var clickable = cur.answered || d.kind !== "count";
    var guess = d.kind === "count" && !cur.answered ?
      '<form class="guess" id="guess"><span class="seg"><button type="button" class="btn ghost' + (cur.side === "b" ? " on" : "") + '" data-side="b">Black ahead</button><button type="button" class="btn ghost' + (cur.side === "w" ? " on" : "") + '" data-side="w">White ahead</button></span>' +
        '<label class="meta">by <input id="margin" type="number" min="0" max="81" step="0.5" inputmode="decimal" aria-label="By how many points"></label><button class="btn primary">Check</button></form>' : "";
    main.innerHTML = '<div class="drill"><button class="back" data-home>← Go</button><div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="row">' + (d._section ? '<span class="chip due">' + d._section + "</span>" : "") + '<span class="chip">' + KIND[d.kind] + "</span>" + (d.kind === "fix" && THEMES[d.theme] ? '<span class="chip">' + esc(THEMES[d.theme][0]) + "</span>" : "") + '<small class="grow">' + (s.at + 1) + " of " + n + "</small></div>" +
      '<p class="prompt">' + promptFor(d) + "</p>" + (ex ? boardSvg(d, ex.board, { numbers: ex.numbers, clickable: true, last: -1 }) : boardSvg(d, cur.board, { marks: marks, own: own, clickable: clickable, last: cur.last })) + key + guess + feedback + '<p class="status" id="status"></p></div>';
  }

  // Grade from how it went: right and quick is easy, right is good, right but slow is hard, wrong is again
  function suggest(ok, ms) { return !ok ? "again" : ms < 8000 ? "easy" : ms < 40000 ? "good" : "hard"; }
  function reveal(ok, grade, text, err) {
    var cur = session.cur;
    cur.answered = true; cur.ok = ok; cur.grade = grade; cur.err = err; cur.ms = Date.now() - cur.start;
    cur.ex = { seq: [], pos: 0, line: null };
    cur.feedback = ('<div class="answer">' + text + '<div class="grades">' + [["again", "Again"], ["hard", "Hard"], ["good", "Good"], ["easy", "Easy"]].map(function (g) {
      return '<button class="btn ' + g[0] + (g[0] === grade ? " pick" : "") + '" data-grade="' + g[0] + '">' + g[1] + "</button>";
    }).join("") + '</div><small>Enter for the suggested grade.</small></div>');
    renderDrill();
  }

  // ---- after answering: step through KataGo's lines, or play your own moves from the position ----
  // A line is points from the drill's position, the player to move first; -1 means they play elsewhere.
  function linesOf(d) {
    var l = d.lines || {}, out = [];
    if (d.kind === "fix") { if (l.best) out.push(["best", "KataGo’s line", l.best]); if (l.game) out.push(["game", "After the game move", l.game]); }
    if (d.kind === "threat") { if (l.answer) out.push(["answer", "If you answer", l.answer]); if (l.ignore) out.push(["ignore", "If you ignore it", l.ignore]); }
    if (d.kind === "count" && l.best) out.push(["best", "Best play from here", l.best]);
    if (d.kind === "tsumego") { var path = solution(d); if (path.length) out.push(["answer", "The answer", path]); }
    return out.filter(function (x) { return x[2] && x[2].length; });
  }
  /** The explored position: the drill's start, then ex.seq up to ex.pos, colours alternating, with captures */
  function played(cur) {
    var d = cur.d, size = d.size, b = boardOf(d), color = d.toMove === "b" ? 1 : 2, ko = -1, numbers = {}, last = -1;
    for (var k = 0; k < cur.ex.pos; k++) {
      var m = cur.ex.seq[k];
      if (m >= 0) {
        var r = R.play(b, size, m, color, ko);
        if (!r) break;
        r.captured.forEach(function (c) { delete numbers[c]; });
        ko = R.koAfter(r.board, size, m, r.captured);
        b = r.board; numbers[m] = k + 1; last = m;
      } else ko = -1;
      color = 3 - color;
    }
    return { board: b, numbers: numbers, next: color, ko: ko, last: last };
  }
  /** Where the explored moves stand against the chosen line */
  function onLine(ex) {
    if (!ex.line) return 0;
    var line = ex.line[2], k = 0;
    while (k < ex.pos && k < line.length && ex.seq[k] === line[k]) k++;
    return k;
  }
  function explorePanel() {
    var cur = session.cur, d = cur.d, ex = cur.ex, lines = linesOf(d);
    var info;
    if (!ex.pos) info = lines.length ? "Step through a line, or click the board to try your own moves." : "Click the board to try your own moves.";
    else {
      var k = onLine(ex), m = ex.seq[ex.pos - 1], who = colorName(((ex.pos - 1) % 2 === 0) === (d.toMove === "b") ? "b" : "w");
      var said = who + " " + (m < 0 ? "plays elsewhere" : pt(m, d.size));
      info = "Move " + ex.pos + ": " + said + (ex.line && k === ex.pos ? " (" + ex.line[1] + ", " + ex.pos + " of " + ex.line[2].length + ")." : ". " + (ex.line ? "Your own moves since move " + (k + 1) + "." : "Your own moves."));
    }
    return '<div class="explore">' + (lines.length ? '<div class="row">' + lines.map(function (l) {
      return '<button class="btn ghost' + (ex.line && ex.line[0] === l[0] ? " on" : "") + '" data-line="' + l[0] + '">' + esc(l[1]) + "</button>";
    }).join("") + "</div>" : "") +
      '<div class="row steps"><button class="btn ghost" data-step="start" aria-label="To the start">⏮</button><button class="btn ghost" data-step="back" aria-label="Back one">◀</button>' +
      '<button class="btn ghost" data-step="fwd" aria-label="Forward one">▶</button><button class="btn ghost" data-step="end" aria-label="To the end">⏭</button><small class="grow" id="exinfo">' + esc(info) + "</small></div></div>";
  }
  function step(how) {
    var ex = session.cur.ex, line = ex.line ? ex.line[2] : [];
    // Forward follows what's been played; past that, the chosen line if still on it
    var known = ex.seq.length, canLine = onLine(ex) === ex.pos && ex.pos >= known && line.length > known;
    if (how === "start") ex.pos = 0;
    else if (how === "back") ex.pos = Math.max(0, ex.pos - 1);
    else if (how === "fwd") {
      if (ex.pos < known) ex.pos++;
      else if (canLine) { ex.seq.push(line[ex.pos]); ex.pos++; }
    } else if (how === "end") {
      ex.pos = known;
      if (onLine(ex) === ex.pos) while (ex.pos < line.length) { ex.seq.push(line[ex.pos]); ex.pos++; }
    }
    renderDrill();
  }
  function chooseLine(name) {
    var ex = session.cur.ex, l = linesOf(session.cur.d).filter(function (x) { return x[0] === name; })[0];
    if (!l) return;
    ex.line = l; ex.seq = l[2].slice(0, 1); ex.pos = 1;
    renderDrill();
  }
  /** Your own move while exploring: whoever's turn it is, there; it replaces anything after it */
  function exploreMove(i) {
    var cur = session.cur, ex = cur.ex, at = played(cur);
    if (!R.play(at.board, cur.d.size, i, at.next, at.ko)) return status("Not a legal move.");
    ex.seq = ex.seq.slice(0, ex.pos).concat([i]); ex.pos++;
    renderDrill();
  }
  function themeNote(d) { var t = THEMES[d.theme]; return t ? "<small>" + esc(t[1]) + "</small>" : ""; }
  function clickPoint(i) {
    var cur = session.cur, d = cur.d, ms = Date.now() - cur.start;
    if (cur.answered) return exploreMove(i);
    if (d.kind === "fix") {
      cur.picked = i;
      var ok = d.answers.indexOf(i) >= 0;
      return reveal(ok, suggest(ok, ms), (ok ? '<span class="right">Right: ' + pt(i, d.size) + ".</span>" : '<span class="wrong">Not ' + pt(i, d.size) + ".</span>") +
        "<span>KataGo’s best: " + d.answers.map(function (a) { return pt(a, d.size); }).join(", ") + ". The game move, " + pt(d.played, d.size) + ", lost " + d.loss + ".</span>" + themeNote(d));
    }
    if (d.kind === "threat") {
      cur.picked = i;
      var hit = d.answers.indexOf(i) >= 0;
      return reveal(hit, suggest(hit, ms), (hit ? '<span class="right">That’s it: ' + pt(i, d.size) + ".</span>" : '<span class="wrong">Not ' + pt(i, d.size) + ".</span>") +
        "<span>The threat: " + d.answers.map(function (a) { return pt(a, d.size); }).join(", ") + ". Ignoring it costs about " + Math.round(d.cost) + " points." +
        (d.defense >= 0 ? " The best answer: " + pt(d.defense, d.size) + "." : "") + "</span>" +
        (d.mine ? "<small>" + (d.answered ? "In your game you answered it." : "In your game you didn’t answer it.") + "</small>" : ""));
    }
    if (d.kind === "tsumego") return tsumegoMove(i, ms);
  }

  // Life and death: follow the problem's tree (OGS's move_tree: { x, y, branches, correct_answer, wrong_answer });
  // a move it doesn't list is wrong. The opponent answers with the first branch.
  function tsumegoMove(i, ms) {
    var cur = session.cur, d = cur.d, size = d.size;
    var x = i % size, y = Math.floor(i / size);
    var br = (cur.node.branches || []).filter(function (b) { return b.x === x && b.y === y; })[0];
    var r = R.play(cur.board, size, i, cur.player, -1);
    if (r) cur.board = r.board;
    if (!br || br.wrong_answer) return reveal(false, "again", '<span class="wrong">That doesn’t work.</span>' + solutionText(d));
    if (br.correct_answer || isRight(br)) return reveal(true, suggest(true, ms), '<span class="right">Solved.</span>');
    var reply = (br.branches || [])[0];
    if (!reply) return reveal(false, "again", '<span class="wrong">That doesn’t work.</span>' + solutionText(d));
    var r2 = R.play(cur.board, size, reply.y * size + reply.x, 3 - cur.player, -1);
    if (r2) cur.board = r2.board;
    cur.node = reply;
    cur.last = reply.y * size + reply.x;
    if (reply.correct_answer || isRight(reply)) return reveal(true, suggest(true, ms), '<span class="right">Solved.</span>');
    if (reply.wrong_answer || !(reply.branches || []).length) return reveal(false, "again", '<span class="wrong">That doesn’t work.</span>' + solutionText(d));
    renderDrill();
  }
  function isRight(n) { return !!n.correct_answer; }
  /** The problem's right answer as points: the first right branch at each turn */
  function solution(d) {
    var path = [], n = d.tree;
    while (n && n.branches && n.branches.length) {
      var good = n.branches.filter(function (b) { return hasRight(b); })[0];
      if (!good) break;
      path.push(good.y * d.size + good.x);
      n = good;
    }
    return path;
  }
  function solutionText(d) {
    var path = solution(d);
    return path.length ? "<span>The answer: " + path.map(function (p) { return pt(p, d.size); }).join(", ") + ".</span>" : "";
  }
  function hasRight(n) { return !!n.correct_answer || (n.branches || []).some(hasRight); }

  function checkCount(e) {
    e.preventDefault();
    var cur = session.cur, d = cur.d, m = parseFloat(document.getElementById("margin").value);
    if (!cur.side) return status("Pick who’s ahead.");
    if (!isFinite(m) || m < 0) return status("How many points?");
    var said = (cur.side === "b" ? 1 : -1) * m, truth = d.lead, err = Math.abs(said - truth), ms = Date.now() - cur.start;
    var wrongSide = Math.abs(truth) >= 3 && (said > 0) !== (truth > 0);
    var grade = wrongSide || err > 4 ? "again" : err > 1.5 ? "hard" : err <= 1 && ms < 20000 ? "easy" : "good";
    reveal(grade !== "again", grade, '<span class="' + (grade === "again" ? "wrong" : "right") + '">KataGo: ' + signedLead(truth) + ". You said " + signedLead(said) + ": off by " + (Math.round(err * 2) / 2) + ".</span>" +
      "<small>The shading shows who owns each point with best play from here: dark for Black, light for White. Score here means the lead with best play, komi included.</small>", err);
  }

  function grade(g) {
    var s = session, cur = s.cur, d = cur.d;
    var body = { grade: g, ms: cur.ms };
    if (cur.err != null) body.err = cur.err;
    api("POST", "/drills/" + d.kind + "/" + encodeURIComponent(d.id) + "/review", body).then(function () {
      if (!d._seen) { s.done++; if (g !== "again") s.right++; }
      d._seen = true;
      if (g === "again") s.again.push(d);
      s.at++;
      next();
    }).catch(fail);
  }

  main.addEventListener("click", function (e) {
    var t = e.target.closest("[data-pt],[data-study],[data-home],[data-grade],[data-side],[data-line],[data-step],[data-plan],[data-today]");
    if (!t) return;
    if (t.dataset.pt != null) return clickPoint(Number(t.dataset.pt));
    if (t.dataset.study != null) return study(t.dataset.study, t.dataset.theme || null);
    if (t.dataset.home != null) return home().catch(fail);
    if (t.dataset.plan === "start") return startPlan();
    if (t.dataset.plan === "next") return nextFocus();
    if (t.dataset.today != null) return startToday();
    if (t.dataset.grade) return grade(t.dataset.grade);
    if (t.dataset.line) return chooseLine(t.dataset.line);
    if (t.dataset.step) return step(t.dataset.step);
    if (t.dataset.side) {
      session.cur.side = t.dataset.side;
      var all = main.querySelectorAll("[data-side]");
      for (var k = 0; k < all.length; k++) all[k].classList.toggle("on", all[k].dataset.side === t.dataset.side);
      var mi = document.getElementById("margin"); if (mi) mi.focus();
    }
  });
  main.addEventListener("submit", function (e) { if (e.target.id === "guess") checkCount(e); });
  document.addEventListener("keydown", function (e) {
    if (!session || !session.cur || !session.cur.answered) return;
    if (e.key === "Enter") { e.preventDefault(); grade(session.cur.grade); }
    if (e.key === "ArrowRight") return step("fwd");
    if (e.key === "ArrowLeft") return step("back");
    var n = { 1: "again", 2: "hard", 3: "good", 4: "easy" }[e.key];
    if (n) grade(n);
  });

  function gate(msg) {
    main.innerHTML = '<p class="status">' + esc(msg) + '</p><button class="btn primary" id="signin">Sign in</button>';
    document.getElementById("signin").onclick = function () { FamilyAuth.login(); };
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account.");
    document.getElementById("signout").hidden = false;
    document.getElementById("signout").onclick = function () { FamilyAuth.logout(); };
    return home().catch(function (e) {
      if (e.status === 403) return gate("Your account doesn’t have access to Go yet.");
      gate("Couldn’t load (" + e.message + "). Reload to try again.");
    });
  }).catch(function (e) { gate(e.message); });
})();
</script>
</body>
</html>
