<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youth Activities Research</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="family.css">
<style>
/* Layout: a field guide. Tabs across the top; chapters, players and money flows as cards; one flashcard at a time.
   Evidence labels keep their colors everywhere: confirmed is leaf, reported is sun, an estimate is pool. */
:root {
  --good: var(--leaf); --bad: var(--ember);
  --c: var(--leaf); --c-soft: color-mix(in srgb, var(--leaf) 14%, var(--surface));
  --r: color-mix(in srgb, var(--sun) 70%, var(--ink)); --r-soft: color-mix(in srgb, var(--sun) 22%, var(--surface));
  --e: var(--pool); --e-soft: color-mix(in srgb, var(--pool) 12%, var(--surface));
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px }
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; padding-bottom: 16px }
.top p { margin-top: 6px; color: var(--muted); max-width: 70ch }
.home { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px }
.home a { color: var(--muted); text-decoration: none; font-size: 14px }
h1 { font-size: clamp(34px, 5vw, 52px) }
.muted { color: var(--muted) }
button { color: inherit; cursor: pointer }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 6px 12px; font-size: 14px; font-weight: 500 }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; border-radius: var(--r-pill); padding: 2px 9px; white-space: nowrap; background: var(--raised); color: var(--ink) }
.tag.C { background: var(--c-soft); color: var(--c) } .tag.R { background: var(--r-soft); color: var(--r) } .tag.E { background: var(--e-soft); color: var(--e) }
.tag.plain { color: var(--muted); font-weight: 500 }
.tag.high { background: var(--c-soft); color: var(--c) } .tag.medium { background: var(--r-soft); color: var(--r) } .tag.low { color: var(--muted) }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px }
nav.tabs button { background: none; border: 0; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-family: var(--display) }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.section-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 28px 0 12px }
.section-h:first-child { margin-top: 4px }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px }
.search { flex: 1 1 240px; max-width: 360px; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; color: var(--ink) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.src a { font-size: 13px; color: var(--muted); word-break: break-all }

/* guide */
.thesis { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--ink); border-radius: var(--r-md); padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 920px }
.thesis .intro { font-size: 17px; max-width: 70ch }
.legs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 860px) { .legs { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 480px) { .legs { grid-template-columns: minmax(0, 1fr) } }
.leg { background: var(--raised); border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px }
.leg b { font-family: var(--display); font-size: 17px }
.chapter { max-width: 920px; padding-top: 18px; margin-top: 22px; border-top: 2px solid var(--ink) }
.chapter > p { color: var(--muted); margin: 6px 0 10px; max-width: 70ch }
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.points li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start }
.points li .tag { justify-content: center; padding-inline: 0 }
.points .src { display: block; margin-top: 2px }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); align-items: center }

/* structures: the forms a company can take, and companies that chose one */
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)) }
.facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 14px }
.facts dt { color: var(--muted); font-size: 13px; padding-top: 1px }
.facts dd { margin: 0 }
@media (max-width: 420px) { .facts { grid-template-columns: minmax(0, 1fr) } .facts dd { margin-bottom: 6px } }
.company .mission { font-size: 15px }
.card details { font-size: 14px }
.card summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600 }
.card details[open] summary { margin-bottom: 8px }
.card details p, .card details .facts { margin: 0 0 8px }
blockquote { margin: 0 0 8px; padding: 8px 12px; border-left: 3px solid var(--line); background: var(--raised); border-radius: 0 var(--r-sm) var(--r-sm) 0 }
blockquote cite { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); font-style: normal }
.lesson { border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; margin-top: auto }

/* money */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top }
thead th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; white-space: nowrap }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.calc { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { .calc { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; display: flex; flex-direction: column; gap: 14px }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px 10px; align-items: center; font-size: 14px }
.fields input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); font: inherit; text-align: right; font-variant-numeric: tabular-nums }
.fields.three { grid-template-columns: minmax(0, 1fr) 64px 64px }
.fields .hd { font-size: 12px; color: var(--muted); text-align: right }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px }
.num { background: var(--raised); border-radius: var(--r-sm); padding: 10px 12px }
.num b { display: block; font-family: var(--display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25 }
.num span { font-size: 12.5px; color: var(--muted) }
.num.big { background: var(--ink); color: var(--bg) } .num.big span { color: inherit; opacity: .75 }
.bars { display: flex; flex-direction: column; gap: 8px }
.brow { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 14px }
@media (max-width: 520px) { .brow { grid-template-columns: minmax(0, 1fr) 90px } .brow .track { grid-column: 1 / -1; order: 3 } }
.track { display: block; position: relative; height: 12px; background: var(--raised); border-radius: 99px; overflow: hidden }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--pool); border-radius: 99px }
.track.leg i { background: var(--leaf) }
.brow .n { text-align: right; font-variant-numeric: tabular-nums }
label.inc { display: flex; gap: 8px; align-items: baseline; font-size: 14px }

/* ask */
.asks { display: flex; flex-direction: column; gap: 10px; max-width: 920px }
.ask { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px }
.ask input { margin-top: 4px; width: 18px; height: 18px }
.ask.done { opacity: .6 }

/* study */
.study { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 860px) { .study { grid-template-columns: minmax(0, 1fr) } }
.panel .chips { gap: 6px; margin-top: 6px }
.meter { height: 8px; border-radius: 99px; background: var(--raised); overflow: hidden; display: flex; margin-top: 6px }
.meter i { display: block; height: 100% }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px }
.stage { display: flex; flex-direction: column; align-items: center; gap: 16px }
.flash { width: min(520px, 100%); min-height: 320px; perspective: 1400px; background: none; border: 0; padding: 0 }
.flash .inner { position: relative; width: 100%; min-height: 320px; transition: transform .5s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d }
.flash.flipped .inner { transform: rotateY(180deg) }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 44px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; box-shadow: 0 10px 30px -18px rgba(30, 42, 36, .35) }
.face.back { transform: rotateY(180deg) }
.face .q { font-family: var(--display); font-size: clamp(19px, 3.4vw, 24px); font-weight: 600; line-height: 1.3; max-width: 30ch }
.face .a { font-family: var(--display); font-size: clamp(22px, 4vw, 30px); font-weight: 600; line-height: 1.15 }
.face .sub { color: var(--muted); max-width: 44ch }
.face .hint { position: absolute; bottom: 14px; font-size: 12px; color: var(--muted) }
.face .kind { position: absolute; top: 14px; left: 16px }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
.btn.good { border-color: var(--good); color: var(--good); background: var(--surface) }
.btn.bad { border-color: var(--bad); color: var(--bad); background: var(--surface) }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(520px, 100%) }
@media (max-width: 460px) { .choices { grid-template-columns: minmax(0, 1fr) } }
.choice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 12px; font-weight: 600; text-align: left; min-width: 0 }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)) }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)) }
.feedback { min-height: 1.5em; font-weight: 600 }
.feedback.good { color: var(--good) } .feedback.bad { color: var(--bad) }
.kbd { font-size: 12px; color: var(--muted); font-weight: 400 }
.foot { margin-top: 40px; font-size: 13px; color: var(--muted); max-width: 75ch }
.sync { font-size: 12px; color: var(--muted) }
.gate { max-width: 520px; margin: 18vh auto 0; text-align: center; display: grid; gap: 14px; justify-items: center }
@media (prefers-reduced-motion: reduce) { .flash .inner { transition: none } }
</style>
</head>
<body>
<div class="wrap">
  <div class="home"><a href="https://dot-y.co/">← dot-y.co</a><span class="sync" id="sync"></span></div>
  <div id="app"><div class="gate"><h1>Youth Activities Research</h1><p class="muted" id="gate-msg">Loading…</p></div></div>
</div>
<script src="family-auth.js"></script>
<script>
/* The guide: study deck, field guide, players, money flows with a calculator, timing and questions to ask,
   all drawn from the guide the API serves. None of the research is written in this file. State `S` is saved
   by save(): to this browser at once and to your account by the loader. */
window.startGuide = function (G, initial) {
  var KEY = "cheer-research-v1";
  var S = initial || {};
  S.boxes = S.boxes || {};   // card id -> Leitner box 0..4
  S.study = S.study || { deck: "all", mode: "choose" };
  S.asked = S.asked || {};
  S.calc = mergeCalc(S.calc);
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    if (window.researchSync) window.researchSync(S);
  }
  // Saved calculator inputs over the guide's defaults, so a new default (a new outcome, say) still shows up.
  function mergeCalc(saved) {
    var c = JSON.parse(JSON.stringify(G.calc));
    c.level = "mid"; c.include = {};
    G.flows.forEach(function (f) { c.include[f.id] = f.capture === "high"; });
    if (!saved) return c;
    Object.keys(saved).forEach(function (k) {
      if (k === "athletes" || k === "include") Object.keys(saved[k] || {}).forEach(function (j) { if (j in c[k]) c[k][j] = saved[k][j]; });
      else if (k === "outcomes") (saved.outcomes || []).forEach(function (o) { c.outcomes.forEach(function (d) { if (d.id === o.id) { d.count = o.count; d.price = o.price; } }); });
      else if (k in c) c[k] = saved[k];
    });
    return c;
  }

  var CH = {}; G.chapters.forEach(function (c) { CH[c.id] = c; });
  var LABEL = { C: "Confirmed", R: "Reported", E: "Estimate" };

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function money(n) { return (n < 0 ? "−$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US"); }
  function short(n) {
    var a = Math.abs(n);
    if (a >= 1e9) return "$" + (n / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
    if (a >= 1e4) return "$" + Math.round(n / 1e3) + "k";
    return money(n);
  }
  function lbl(l) { return '<span class="tag ' + l + '" title="' + LABEL[l] + '">' + l + "</span>"; }
  function sources(src) { return src && src.length ? '<span class="src">' + src.map(function (s) { return '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s.replace(/^https?:\/\/(www\.)?/, "").split("/")[0]) + "</a>"; }).join(" · ") + "</span>" : ""; }

  // Structures: the forms a company can take and the companies that chose them, with their own chapters
  // (section "structures"), which the guide leaves out. A guide built without them has no such tab.
  var ST = G.structure || null;
  var GUIDE_CHAPTERS = G.chapters.filter(function (c) { return c.section !== "structures"; });
  var TAB_NAMES = [["study", "Study"], ["guide", "Guide"], ["structures", "Structures"], ["players", "Players"], ["money", "Money"], ["timing", "Timing"], ["ask", "Ask"]]
    .filter(function (t) { return t[0] !== "structures" || ST; });

  $("#app").innerHTML =
    '<header class="top"><div><div class="eyebrow">Market research</div><h1>Youth Activities Research</h1>' +
    "<p>" + esc(G.thesis.title) + ". The youth activities market, from cheer and dance out: who’s in it, who owns them, who bills what where, " + (ST ? "how a company can be owned so its mission lasts, " : "") + "and a deck to learn it.</p></div>" +
    '<div class="chips"><span class="tag">' + G.cards.length + " cards</span><span class=\"tag\">" + G.players.length + " players</span><span class=\"tag\">" + G.flows.length + " money flows</span></div></header>" +
    '<nav class="tabs" role="tablist">' +
    TAB_NAMES.map(function (t) {
      return '<button role="tab" type="button" data-tab="' + t[0] + '" aria-selected="false">' + t[1] + "</button>";
    }).join("") + "</nav>" +
    '<section id="tab-study" role="tabpanel" hidden><div class="study"><aside class="panel">' +
    '<div><div class="eyebrow">Deck</div><div class="chips" id="deckChips"></div></div>' +
    '<div><div class="eyebrow">Answer by</div><div class="chips" id="modeChips"></div></div>' +
    '<div><div class="eyebrow">Progress in this deck</div><div class="meter" id="meter"></div><div class="legend" id="legend"></div></div>' +
    '<button class="chip" id="resetDeck" type="button">Reset this deck’s progress</button>' +
    '<div id="resetConfirm" hidden class="chips"><span class="muted" style="font-size:13px;align-self:center">Clear progress?</span><button class="chip" id="resetYes" type="button">Clear</button><button class="chip" id="resetNo" type="button">Keep</button></div>' +
    '</aside><div class="stage" id="stage"></div></div></section>' +
    '<section id="tab-guide" role="tabpanel" hidden><div id="guide"></div></section>' +
    (ST ? '<section id="tab-structures" role="tabpanel" hidden><div id="structures"></div></section>' : "") +
    '<section id="tab-players" role="tabpanel" hidden><div class="bar"><input class="search" id="q" type="search" placeholder="Search names, owners, facts" aria-label="Search players"><div class="chips" id="roleChips"></div></div>' +
    '<div class="bar"><div class="chips" id="kindChips"></div></div><div id="playerList"></div></section>' +
    '<section id="tab-money" role="tabpanel" hidden><div id="money"></div></section>' +
    '<section id="tab-timing" role="tabpanel" hidden><div id="timing"></div></section>' +
    '<section id="tab-ask" role="tabpanel" hidden><div id="asks"></div></section>' +
    '<p class="foot">' + esc(G.note) + "</p>";

  // ---------- tabs
  var TABS = TAB_NAMES.map(function (t) { return t[0]; });
  function showTab(name) {
    document.querySelectorAll("nav.tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false"); });
    document.querySelectorAll("[role=tabpanel]").forEach(function (s) { s.hidden = s.id !== "tab-" + name; });
    if (S.tab !== name) { S.tab = name; save(); }
  }
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); }); });
  var hashTab = (location.hash || "").slice(1);
  showTab(TABS.indexOf(hashTab) >= 0 ? hashTab : (TABS.indexOf(S.tab) >= 0 ? S.tab : "study"));

  // ---------- guide
  (function () {
    var t = G.thesis;
    var h = '<div class="thesis"><div><div class="eyebrow">The thesis</div><h2 style="font-size:30px;margin-top:4px">' + esc(t.title) + "</h2></div>" +
      '<p class="intro">' + esc(t.intro) + '</p><div class="legs">' + t.legs.map(function (l) { return '<div class="leg"><b>' + esc(l.name) + "</b>" + esc(l.what) + "</div>"; }).join("") + "</div>" +
      '<div><div class="eyebrow">The deadline</div>' + esc(t.deadline) + "</div></div>" +
      '<div class="section-h"><div class="chips jump">' + GUIDE_CHAPTERS.map(function (c) { return '<button class="chip" type="button" data-ch="' + c.id + '">' + esc(c.title) + "</button>"; }).join("") + "</div></div>" +
      legend() + GUIDE_CHAPTERS.map(chapter).join("");
    $("#guide").innerHTML = h;
  })();
  function legend() { return '<div class="legend-row">' + ["C", "R", "E"].map(function (l) { return lbl(l) + " " + LABEL[l]; }).join("") + "</div>"; }
  function chapter(c) {
    return '<article class="chapter" id="ch-' + c.id + '"><div class="eyebrow">' + esc(c.eyebrow) + "</div><h2>" + esc(c.title) + "</h2><p>" + esc(c.summary) + '</p><ul class="points">' +
      c.points.map(function (p) { return "<li>" + lbl(p.label) + "<div>" + esc(p.text) + sources(p.src) + "</div></li>"; }).join("") + "</ul></article>";
  }
  // Chapter chips (and the structures tab's section chips) scroll to what they name
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".jump [data-ch]"); if (!b) return;
    var el = document.getElementById("ch-" + b.getAttribute("data-ch")); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth" });
  });

  // ---------- structures
  var FORM = {}; if (ST) ST.forms.forEach(function (f) { FORM[f.id] = f; });
  S.sgroup = S.sgroup || "";
  function renderCompanies() {
    var q = ($("#sq").value || "").trim().toLowerCase();
    var list = ST.companies.filter(function (c) {
      if (S.sgroup && c.group !== S.sgroup) return false;
      return !q || [c.name, c.structure, c.founders, c.mission, c.why, c.how, c.outcome].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    $("#groupChips").innerHTML = Object.keys(ST.groups).map(function (k) { return '<button class="chip" type="button" data-group="' + k + '" aria-pressed="' + (S.sgroup === k) + '">' + esc(ST.groups[k]) + "</button>"; }).join("");
    $("#companyList").innerHTML = list.length ? '<div class="grid wide">' + list.map(function (c) {
      var when = [c.founded ? "Founded " + c.founded : "", c.founders].filter(Boolean).join(" · ");
      var qt = c.quote ? "<blockquote>“" + esc(c.quote.text) + "”<cite>" + esc(c.quote.by) + " " + sources([c.quote.src]) + "</cite></blockquote>" : "";
      return '<article class="card company"><div class="tags"><span class="tag plain">' + esc(ST.groups[c.group]) + "</span>" +
        (c.structureIds || []).map(function (id) { return '<span class="tag">' + esc(FORM[id].name) + "</span>"; }).join("") + lbl(c.label) + "</div>" +
        "<h3>" + esc(c.name) + "</h3>" + (when ? '<div class="muted" style="font-size:14px">' + esc(when) + "</div>" : "") +
        '<div class="muted" style="font-size:14px">' + esc(c.structure) + "</div>" +
        (c.mission ? '<div class="mission">' + esc(c.mission) + "</div>" : "") +
        "<details><summary>Why, how, and how it went</summary>" +

    var flip = st.mode === "flip";
    var h = '<button class="flash" id="flash" type="button" aria-label="Flashcard"><div class="inner">' +
      '<div class="face front"><span class="kind tag plain">' + esc(cur.kind) + "</span>" + faceHtml(cur.front) + (flip ? '<span class="hint">Tap or press space to flip</span>' : "") + "</div>" +
      '<div class="face back"><span class="kind tag plain">' + esc(cur.kind) + "</span>" + faceHtml(cur.back) + "</div></div></button>";
    if (flip) {
      h += '<div class="actions" id="gradeBtns" hidden><button class="btn bad" type="button" id="miss">Missed it <span class="kbd">1</span></button><button class="btn good" type="button" id="got">Knew it <span class="kbd">2</span></button></div>';
    } else {
      h += '<div class="choices" id="choices">' + optionsFor(cur).map(function (o, i) { return '<button class="choice" type="button" data-o="' + esc(o) + '"><span class="kbd">' + (i + 1) + "</span> " + esc(o) + "</button>"; }).join("") + "</div>" +
        '<div class="feedback" id="fb" aria-live="polite"></div><div class="actions"><button class="btn primary" type="button" id="nextBtn" hidden>Next card <span class="kbd" style="color:inherit">↵</span></button></div>';
    }
    $("#stage").innerHTML = h;
    $("#flash").addEventListener("click", function () { if (flip) { $("#flash").classList.toggle("flipped"); $("#gradeBtns").hidden = false; } });
    if (flip) {
      $("#miss").onclick = function () { grade(false); next(); };
      $("#got").onclick = function () { grade(true); next(); };
    } else {
      $("#choices").onclick = function (e) { var b = e.target.closest("[data-o]"); if (b) choose(b); };
      $("#nextBtn").onclick = next;
    }
  }
  function choose(b) {
    if (answered) return; answered = true;
    var ok = b.getAttribute("data-o") === cur.answer;
    document.querySelectorAll(".choice").forEach(function (c) { if (c.getAttribute("data-o") === cur.answer) c.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $("#fb").className = "feedback " + (ok ? "good" : "bad");
    $("#fb").textContent = ok ? "Right." : "It’s " + cur.answer + ".";
    $("#flash").classList.add("flipped");
    $("#nextBtn").hidden = false; $("#nextBtn").focus();
    grade(ok);
  }
  document.addEventListener("keydown", function (e) {
    if ($("#tab-study").hidden || /INPUT|TEXTAREA/.test(e.target.tagName) || !cur) return;
    if (st.mode === "flip") {
      if (e.key === " ") { e.preventDefault(); $("#flash").classList.toggle("flipped"); $("#gradeBtns").hidden = false; return; }
      if ($("#gradeBtns").hidden) return;
      if (e.key === "1") { grade(false); next(); }
      if (e.key === "2") { grade(true); next(); }
    } else {
      var n = parseInt(e.key, 10), opts = document.querySelectorAll(".choice");
      if (n >= 1 && n <= opts.length) choose(opts[n - 1]);
      if (e.key === "Enter" && answered && document.activeElement && document.activeElement.id !== "nextBtn") next();
    }
  });
  $("#resetDeck").onclick = function () { $("#resetConfirm").hidden = false; $("#resetDeck").hidden = true; };
  $("#resetNo").onclick = function () { $("#resetConfirm").hidden = true; $("#resetDeck").hidden = false; };
  $("#resetYes").onclick = function () { cards.forEach(function (c) { delete boxes[c.id]; }); save(); $("#resetNo").onclick(); renderProgress(); };

  function renderStudy() {
    chipRow($("#deckChips"), DECKS, "deck");
    chipRow($("#modeChips"), MODES, "mode");
    cards = buildCards(); lastId = null;
    renderProgress(); next();
  }
  renderStudy();
};
</script>
<script>
/* Signs in, then loads the guide and your saved progress from the API and starts the page.
   It runs after startGuide is defined: with cached responses the loads can finish before a later script would.
   The guide (private research) is served by the API so it isn't public. Progress is kept in this browser and
   saved to your account a moment after each change, so every device picks up where you left off. */
(function () {
  var KEY = "cheer-research-v1", cfg, pending = null, timer = null, saving = false;
  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method, keepalive: method === "PUT",
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    });
  }
  function status(text) { var el = document.getElementById("sync"); if (el) el.textContent = text; }
  function push() {
    clearTimeout(timer); timer = null;
    if (saving || !pending) return;
    var body = pending; pending = null; saving = true;
    var retry = false;
    api("PUT", "/progress", { progress: body }).then(function (res) {
      if (!res.ok) throw new Error(res.status);
      status("Saved to your account");
    }).catch(function () {
      if (!pending) pending = body; retry = true;
      status("Saved in this browser · retrying");
    }).then(function () {
      saving = false;
      if (pending) timer = setTimeout(push, retry ? 5000 : 200);
    });
  }
  window.researchSync = function (state) {
    pending = JSON.parse(JSON.stringify(state));
    clearTimeout(timer); timer = setTimeout(push, 1000);
  };
  window.addEventListener("pagehide", push);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") push(); });

  function gate(msg, signIn) {
    document.getElementById("gate-msg").textContent = msg;
    if (signIn && !document.getElementById("signin")) {
      var b = document.createElement("button"); b.id = "signin"; b.className = "btn primary"; b.textContent = "Sign in";
      b.onclick = function () { FamilyAuth.login(); };
      document.querySelector(".gate").appendChild(b);
    }
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account.", true);
    return Promise.all([api("GET", "/guide"), api("GET", "/progress")]).then(function (r) {
      if (r[0].status === 403) return gate("Your account doesn’t have access to Youth Activities Research.");
      if (!r[0].ok || !(r[1].ok || r[1].status === 404)) throw new Error("load failed");
      return Promise.all([r[0].json(), r[1].status === 404 ? null : r[1].json()]).then(function (x) {
        var local = null;
        try { local = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
        var start = x[1] ? x[1].progress : local;
        try { if (start) localStorage.setItem(KEY, JSON.stringify(start)); } catch (e) {}
        if (!x[1] && local) window.researchSync(local);
        window.startGuide(x[0].guide, start);
        status(x[1] || !local ? "Saved to your account" : "Saved in this browser");
      });
    });
  }).catch(function () {
    gate("Couldn’t load Youth Activities Research. Reload to try again.", true);
  });
})();
</script>
</body>
