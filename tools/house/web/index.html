<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="family.css">
<style>
/* Layout: one narrow column. Header, a line on how fresh the picture is, then a card per room.
   A device you may control gets a switch, and a dimmer also a brightness slider under its name. */
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.top a { color: var(--muted); text-decoration: none; font-size: 14px }
h1 { font-size: clamp(32px, 6vw, 48px) }
.status { color: var(--muted); font-size: 14px; min-height: 1.4em; margin: 0 }
.status.warn { color: var(--ember) }
.rooms { display: grid; gap: 16px }
.room h2 { font-size: 20px; margin: 0 0 8px }
.room ul { list-style: none; margin: 0; padding: 0 }
.room li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.room li:first-child { border-top: 0 }
.name { min-width: 0 }
.state { font-size: 14px; color: var(--muted); white-space: nowrap }
.state.on { color: var(--leaf); font-weight: 600 }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 8px; vertical-align: 1px }
.on .dot { background: var(--sun) }
.switch { width: 48px; height: 28px; border-radius: var(--r-pill); border: 0; background: var(--line); position: relative; cursor: pointer; padding: 0 }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .15s }
.switch[aria-checked="true"] { background: var(--leaf) }
.switch[aria-checked="true"]::after { left: 23px }
.switch:disabled { opacity: .5; cursor: wait }
.dim { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted) }
.dim input { flex: 1; min-width: 0; accent-color: var(--sun) }
.dim output { width: 3.5em; text-align: right }
.err { grid-column: 1 / -1; color: var(--ember); font-size: 14px; margin: 0 }
/* People & access (admins): who may do what, groups, and recent activity */
#admin { display: grid; gap: 16px }
#admin h2 { font-size: 24px; margin: 8px 0 0 }
#admin h3 { font-size: 17px; margin: 0 0 8px }
.rules { list-style: none; margin: 0; padding: 0 }
.rules li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px }
.rules li:first-child { border-top: 0 }
.rules small { color: var(--muted) }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px }
.x:hover { color: var(--ember) }
.pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
.pick select, .pick input[type=text] { flex: 1 1 140px; min-width: 0; background: var(--raised); border: 1.5px solid transparent; border-radius: var(--r-sm); padding: 8px 10px; color: var(--ink); font: inherit }
.pick select:focus, .pick input:focus { border-color: var(--pool); outline: none }
.log li { display: block }
.log .what { display: block }
.log small { display: block }
.denied { color: var(--ember) }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><a href="https://dot-y.co/">← dot-y.co</a><button class="btn ghost" id="signout" hidden>Sign out</button></div>
  <h1>House</h1>
  <div id="main"><p class="status">Loading…</p></div>
  <div id="admin" hidden></div>
</div>
<script src="family-auth.js"></script>
<script>
(function () {
  var cfg, home, busy = {}, errors = {}, refreshTimer = null;
  var main = document.getElementById("main");
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method,
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    });
  }

  // How long ago, in words, for the freshness line
  function ago(iso) {
    var s = Math.round((Date.now() - Date.parse(iso)) / 1000);
    if (s < 90) return "just now";
    if (s < 5400) return Math.round(s / 60) + " minutes ago";
    return Math.round(s / 3600) + " hours ago";
  }

  var pct = function (e) { return typeof e.attrs.brightness === "number" ? Math.max(1, Math.round(e.attrs.brightness / 2.55)) : null; };

  function stateText(e) {
    if (e.state === "unavailable" || e.state === "unknown") return "Not responding";
    if (e.state !== "on") return e.state === "off" ? "Off" : e.state;
    return pct(e) !== null ? "On · " + pct(e) + "%" : "On";
  }

  function find(id) {
    for (var i = 0; i < home.areas.length; i++) {
      for (var j = 0; j < home.areas[i].entities.length; j++) if (home.areas[i].entities[j].id === id) return home.areas[i].entities[j];
    }
    return null;
  }

  function row(e) {
    var on = e.state === "on", can = e.actions || {}, dead = e.state === "unavailable" || e.state === "unknown";
    var html = '<li data-id="' + esc(e.id) + '"><span class="name' + (on ? " on" : "") + '"><span class="dot"></span>' + esc(e.name) + "</span>";
    if (can.turn_on && can.turn_off && !dead) {
      html += '<button class="switch" role="switch" aria-checked="' + on + '" aria-label="' + esc(e.name) + '" data-toggle' + (busy[e.id] ? " disabled" : "") + "></button>";
    } else {
      html += '<span class="state' + (on ? " on" : "") + '">' + esc(stateText(e)) + "</span>";
    }
    if (can.turn_on && can.turn_on.indexOf("brightness_pct") >= 0 && on && pct(e) !== null) {
      html += '<label class="dim">Brightness <input type="range" min="1" max="100" value="' + pct(e) + '" data-dim aria-label="' + esc(e.name) + ' brightness"' + (busy[e.id] ? " disabled" : "") + "><output>" + pct(e) + "%</output></label>";
    }
    if (errors[e.id]) html += '<p class="err">' + esc(errors[e.id]) + "</p>";
    return html + "</li>";
  }

  function render() {
    var r = home.relay, fresh;
    if (!r.lastSync) fresh = '<p class="status warn">The house hasn’t reported yet.</p>';
    else if (r.stale || !r.connected) fresh = '<p class="status warn">The house last reported ' + esc(ago(r.lastSync)) + ", so this may be out of date.</p>";
    else fresh = '<p class="status">Live from the house.</p>';
    if (!home.areas.length) {
      main.innerHTML = fresh + '<p class="status">Nothing here is shared with you yet. Ask Luke.</p>';
      return;
    }
    main.innerHTML = fresh + '<div class="rooms">' + home.areas.map(function (a) {
      return '<section class="card room"><h2>' + esc(a.name) + "</h2><ul>" + a.entities.map(row).join("") + "</ul></section>";
    }).join("") + "</div>";
  }

  // Sends a command; a `confirm` grant answers 202 with a question first
  function send(e, action, data, confirmId) {
    busy[e.id] = true; delete errors[e.id]; render();
    var body = { entity_id: e.id, action: action, data: data };
    if (confirmId) body.confirm_id = confirmId;
    return api("POST", "/commands", body).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (out) {
        if (res.status === 202) {
          busy[e.id] = false; render();
          return window.confirm(out.prompt) ? send(e, action, data, out.confirm_id) : null;
        }
        busy[e.id] = false;
        if (res.ok) {
          // Show it now; the house's own report follows within a few seconds
          e.state = action === "turn_off" ? "off" : "on";
          if (data.brightness_pct) e.attrs.brightness = Math.round(data.brightness_pct * 2.55);
          render();
          clearTimeout(refreshTimer);
          refreshTimer = setTimeout(function () { load().catch(function () {}); }, 2500);
          return;
        }
        errors[e.id] = res.status === 403 ? "You can’t change this one." : res.status === 504 ? (out.error || "The house is offline.") + ". Try again." : "Didn’t work: " + (out.error || res.status) + ".";
        render();
      });
    }).catch(function () { busy[e.id] = false; errors[e.id] = "Couldn’t reach the house. Try again."; render(); });
  }

  main.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-toggle]"); if (!b || b.disabled) return;
    var e = find(b.closest("li").dataset.id); if (!e) return;
    send(e, e.state === "on" ? "turn_off" : "turn_on", {});
  });
  main.addEventListener("input", function (ev) {
    if (!ev.target.matches("[data-dim]")) return;
    ev.target.nextElementSibling.textContent = ev.target.value + "%";
  });
  main.addEventListener("change", function (ev) {
    if (!ev.target.matches("[data-dim]")) return;
    var e = find(ev.target.closest("li").dataset.id); if (!e) return;
    send(e, "turn_on", { brightness_pct: Number(ev.target.value) });
  });

  // ---- People & access (admins only; the API refuses everyone else) ----
  var adminEl = document.getElementById("admin"), access = null, activity = [], adminMsg = "";
  var LEVEL = { read: "Can see", confirm: "Ask first", control: "Can control" };
  var DONE = { done: "", denied: "not allowed", failed: "failed", offline: "house offline", timeout: "no answer" };

  function whoName(who) {
    if (who.indexOf("group:") === 0) {
      for (var g = 0; g < access.groups.length; g++) if (access.groups[g].id === who.slice(6)) return "Group “" + access.groups[g].name + "”";
      return "A removed group";
    }
    var sub = who.slice(4);
    for (var i = 0; i < access.people.length; i++) if (access.people[i].sub === sub) return access.people[i].name;
    return "Someone no longer in House";
  }
  function whereName(where) {
    if (where === "*") return "Everywhere";
    var id = where.slice(where.indexOf(":") + 1), list = where.indexOf("area:") === 0 ? access.areas : access.entities;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
    return id;
  }
  function personName(sub) {
    for (var i = 0; i < access.people.length; i++) if (access.people[i].sub === sub) return access.people[i].name;
    return "Someone";
  }
  function when(iso) {
    return new Date(iso).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" });
  }

  function renderAdmin() {
    var opts = function (list, val, label) { return list.map(function (x) { return '<option value="' + esc(val(x)) + '">' + esc(label(x)) + "</option>"; }).join(""); };
    var grants = access.grants.slice().sort(function (a, b) { return whoName(a.who).localeCompare(whoName(b.who)); });
    var html = "<h2>People &amp; access</h2>";
    if (adminMsg) html += '<p class="status warn">' + esc(adminMsg) + "</p>";

    html += '<section class="card"><h3>Who can do what</h3><p class="status">Admins can control everything. Everyone else sees only what’s listed here.</p><ul class="rules">' +
      (grants.length ? grants.map(function (g) {
        return '<li data-grant="' + esc(g.id) + '"><span>' + esc(whoName(g.who)) + " · " + esc(whereName(g.where)) + " · <strong>" + esc(LEVEL[g.level]) + '</strong></span><button class="x" data-del-grant aria-label="Remove">&times;</button></li>';
      }).join("") : '<li><small>No one yet.</small></li>') + "</ul>" +
      '<form class="pick" id="add-grant"><select id="g-who" aria-label="Who">' +
      opts(access.people, function (p) { return "sub:" + p.sub; }, function (p) { return p.name; }) +
      opts(access.groups, function (g) { return "group:" + g.id; }, function (g) { return "Group “" + g.name + "”"; }) +
      '</select><select id="g-where" aria-label="Where"><option value="*">Everywhere</option><optgroup label="Rooms">' +
      opts(access.areas, function (a) { return "area:" + a.id; }, function (a) { return a.name; }) +
      '</optgroup><optgroup label="Devices">' + opts(access.entities, function (e) { return "entity:" + e.id; }, function (e) { return e.name; }) +
      '</optgroup></select><select id="g-level" aria-label="Level"><option value="read">Can see</option><option value="confirm">Ask first</option><option value="control">Can control</option></select>' +
      '<button class="btn primary">Add</button></form></section>';

    html += '<section class="card"><h3>Groups</h3><p class="status">Groups like “Kids” are shared by every family tool. Family admins manage them at <a href="https://dot-y.co/family">dot-y.co/family</a>; give a group access here.</p></section>';

    html += '<section class="card"><h3>Recent activity</h3><ul class="rules log">' + (activity.length ? activity.slice(0, 50).map(function (a) {
      var verb = (a.action === "turn_off" ? "turned off " : "turned on ") + (a.name || a.entity_id) + (a.data && a.data.brightness_pct ? " at " + a.data.brightness_pct + "%" : "");
      var how = DONE[a.outcome] === undefined ? a.outcome : DONE[a.outcome];
      return '<li><span class="what' + (a.outcome === "done" ? "" : " denied") + '">' + esc(personName(a.who)) + " " + esc(verb) + (how ? " — " + esc(how) : "") + "</span><small>" + esc(when(a.at)) + (a.via === "dot" ? " · through Dot" : "") + "</small></li>";
    }).join("") : '<li><small>Nothing this week.</small></li>') + "</ul></section>";
    adminEl.innerHTML = html;
    adminEl.hidden = false;
  }

  function loadAdmin() {
    return Promise.all([api("GET", "/access"), api("GET", "/log")]).then(function (rs) {
      if (!rs[0].ok || !rs[1].ok) return;
      return Promise.all([rs[0].json(), rs[1].json()]).then(function (j) { access = j[0]; activity = j[1]; renderAdmin(); });
    });
  }
  // Every change reloads the lists, so what's shown is what's stored; a 409 says someone else got there first
  function change(method, path, body) {
    adminMsg = "";
    return api(method, path, body).then(function (res) {
      if (res.status === 409) adminMsg = "Someone else changed that just now. Here’s the latest.";
      else if (!res.ok) adminMsg = "Couldn’t save that (" + res.status + "). Try again.";
      return loadAdmin();
    }).catch(function () { adminMsg = "Couldn’t reach House. Try again."; renderAdmin(); });
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  adminEl.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "add-grant") {
      var who = document.getElementById("g-who").value;
      if (!who) return;
      change("PUT", "/grants/" + uid(), { who: who, where: document.getElementById("g-where").value, level: document.getElementById("g-level").value });
    }
  });
  adminEl.addEventListener("click", function (ev) {
    var g = ev.target.closest("[data-del-grant]");
    if (g) change("DELETE", "/grants/" + encodeURIComponent(g.closest("li").dataset.grant));
  });
  function gate(msg) {
    main.innerHTML = '<p class="status">' + esc(msg) + '</p><button class="btn primary" id="signin">Sign in</button>';
    document.getElementById("signin").onclick = function () { FamilyAuth.login(); };
  }

  function load() {
    return api("GET", "/home").then(function (res) {
      if (res.status === 403) return gate("Your account doesn’t have access to House yet.");
      if (!res.ok) throw new Error("Couldn’t load (" + res.status + "). Reload to try again.");
      return res.json().then(function (h) {
        // Don't redraw under someone mid-command or mid-drag
        for (var id in busy) if (busy[id]) return;
        if (document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-dim]")) return;
        var first = !home;
        home = h; render();
        if (first && h.you.admin) loadAdmin().catch(function () {});
      });
    });
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account.");
    document.getElementById("signout").hidden = false;
    document.getElementById("signout").onclick = function () { FamilyAuth.logout(); };
    // Keep the picture current while the page is open and visible
    setInterval(function () { if (!document.hidden) load().catch(function () {}); }, 15000);
    return load();
  }).catch(function (e) { gate(e.message); });
})();
</script>
</body>
</html>
