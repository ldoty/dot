<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="family.css">
<style>
/* Layout: one narrow column. Header, a line on how fresh the picture is, then a card per room. */
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.top a { color: var(--muted); text-decoration: none; font-size: 14px }
h1 { font-size: clamp(32px, 6vw, 48px) }
.status { color: var(--muted); font-size: 14px; min-height: 1.4em; margin: 0 }
.status.warn { color: var(--ember) }
.rooms { display: grid; gap: 16px }
.room h2 { font-size: 20px; margin: 0 0 8px }
.room ul { list-style: none; margin: 0; padding: 0 }
.room li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.room li:first-child { border-top: 0 }
.state { font-size: 14px; color: var(--muted); white-space: nowrap }
.state.on { color: var(--leaf); font-weight: 600 }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 8px; vertical-align: 1px }
.on .dot { background: var(--sun) }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><a href="https://dot-y.co/">← dot-y.co</a><button class="btn ghost" id="signout" hidden>Sign out</button></div>
  <h1>House</h1>
  <div id="main"><p class="status">Loading…</p></div>
</div>
<script src="family-auth.js"></script>
<script>
(function () {
  var cfg;
  var main = document.getElementById("main");
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method,
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    });
  }

  // How long ago, in words, for the freshness line
  function ago(iso) {
    var s = Math.round((Date.now() - Date.parse(iso)) / 1000);
    if (s < 90) return "just now";
    if (s < 5400) return Math.round(s / 60) + " minutes ago";
    return Math.round(s / 3600) + " hours ago";
  }

  function stateText(e) {
    if (e.state === "unavailable" || e.state === "unknown") return "Not responding";
    if (e.state !== "on") return e.state === "off" ? "Off" : e.state;
    if (typeof e.attrs.brightness === "number") return "On · " + Math.round(e.attrs.brightness / 2.55) + "%";
    return "On";
  }

  function render(home) {
    var r = home.relay, fresh;
    if (!r.lastSync) fresh = '<p class="status warn">The house hasn’t reported yet.</p>';
    else if (r.stale || !r.connected) fresh = '<p class="status warn">The house last reported ' + esc(ago(r.lastSync)) + ', so this may be out of date.</p>';
    else fresh = '<p class="status">Live from the house.</p>';
    if (!home.areas.length) {
      main.innerHTML = fresh + '<p class="status">Nothing here is shared with you yet. Ask Luke.</p>';
      return;
    }
    main.innerHTML = fresh + '<div class="rooms">' + home.areas.map(function (a) {
      return '<section class="card room"><h2>' + esc(a.name) + "</h2><ul>" + a.entities.map(function (e) {
        var on = e.state === "on";
        return '<li data-id="' + esc(e.id) + '"><span' + (on ? ' class="on"' : "") + '><span class="dot"></span>' + esc(e.name) + '</span>' +
          '<span class="state' + (on ? " on" : "") + '">' + esc(stateText(e)) + "</span></li>";
      }).join("") + "</ul></section>";
    }).join("") + "</div>";
  }

  function gate(msg) {
    main.innerHTML = '<p class="status">' + esc(msg) + '</p><button class="btn primary" id="signin">Sign in</button>';
    document.getElementById("signin").onclick = function () { FamilyAuth.login(); };
  }

  function load() {
    return api("GET", "/home").then(function (res) {
      if (res.status === 403) return gate("Your account doesn’t have access to House yet.");
      if (!res.ok) throw new Error("Couldn’t load (" + res.status + "). Reload to try again.");
      return res.json().then(render);
    });
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account.");
    document.getElementById("signout").hidden = false;
    document.getElementById("signout").onclick = function () { FamilyAuth.logout(); };
    // Keep the picture current while the page is open and visible
    setInterval(function () { if (!document.hidden) load().catch(function () {}); }, 15000);
    return load();
  }).catch(function (e) { gate(e.message); });
})();
</script>
</body>
</html>
