<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Luke &amp; Amber Budget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Karla:ital,wght@0,400;0,500;0,600;1,400&amp;family=Young+Serif&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style id="budget-css">
/* Layout: summary band up top, category ledgers below in one column, breakdown rail beside them on wide screens.
   Colors and type follow the Daylight & Evening house style (style-guide.html). */
:root {
  /* Daylight (Luke) */
  --bg: #fbf9f3; --surface: #ffffff; --raised: #f3efe4; --ink: #1e2a24; --muted: #5d6a62; --line: #e4ddcd;
  --leaf: #2f9e5b; --pool: #0b7b7e; --sun: #e9a41a; --ember: #e8612c; --bloom: #e0607e; --wood: #a5622d;
  --on-accent: #ffffff; --on-sun: #1e2a24;
  --texture: none;
  --display: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --body: "Karla", "Helvetica Neue", system-ui, sans-serif;
  --serif: "Young Serif", Georgia, serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --r-sm: 8px; --r-md: 14px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  /* Evening (Amber) */
  --bg: #1a1613; --surface: #241e19; --raised: #2e2620; --ink: #f1e7d8; --muted: #b3a593; --line: #3b322a;
  --leaf: #93a861; --pool: #4fa9a8; --sun: #e2b04c; --ember: #d26a3c; --bloom: #b46a8c; --wood: #bf8d55;
  --on-accent: #1a1613; --on-sun: #1a1613;
  --texture: radial-gradient(rgba(241,231,216,.035) 1px, transparent 1.2px);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1a1613; --surface: #241e19; --raised: #2e2620; --ink: #f1e7d8; --muted: #b3a593; --line: #3b322a;
  --leaf: #93a861; --pool: #4fa9a8; --sun: #e2b04c; --ember: #d26a3c; --bloom: #b46a8c; --wood: #bf8d55;
  --on-accent: #1a1613; --on-sun: #1a1613;
  --texture: radial-gradient(rgba(241,231,216,.035) 1px, transparent 1.2px);
  color-scheme: dark }
:root[data-theme="light"] { color-scheme: light }
/* Working aliases used by the components below */
:root, :root[data-theme] {
  --accent: var(--pool);
  --accent-soft: color-mix(in srgb, var(--pool) 14%, var(--surface));
  --good: color-mix(in srgb, var(--leaf) 60%, var(--ink));
  --bad: color-mix(in srgb, var(--ember) 60%, var(--ink));
  --field: var(--raised);
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); background-image: var(--texture); background-size: 6px 6px; color: var(--ink); font: 15px/1.55 var(--body) }
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 8px }
h1 { font: 500 clamp(30px, 4.5vw, 46px)/1.05 var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; display: flex; align-items: center; gap: 12px }
h1 em { font: 400 1em var(--serif); font-style: normal; color: var(--wood) }
h1 svg { width: .9em; height: .9em; flex: none }
.mode { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--raised) }
.mode button { border: 0; background: none; padding: 5px 12px; font-size: 13px }
.mode button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch }
.savebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.status { font-size: 13px; color: var(--muted) }
.status.dirty { color: var(--accent); font-weight: 600 }
button { font: 600 14px var(--body); border-radius: var(--r-pill); padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
button.primary { background: var(--pool); border-color: var(--pool); color: var(--on-accent) }
button:disabled { opacity: .45; cursor: default }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.note { background: color-mix(in srgb, var(--sun) 16%, var(--surface)); border-radius: var(--r-sm); padding: 10px 14px; font-size: 13.5px; margin: 18px 0 24px }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px }
.tile .lbl { font: 600 11.5px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted) }
.tile .val { font: 400 30px/1.2 var(--serif); font-variant-numeric: tabular-nums; margin-top: 4px }
.tile .per { font-size: 12.5px; color: var(--muted); font-family: var(--mono) }
.val.pos { color: var(--good) } .val.neg { color: var(--bad) }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) } }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 16px }
@media (max-width: 900px) { .rail { position: static } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px }
.panel h3 { font: 600 16px var(--display); margin: 0 0 12px }

section.cat { margin-bottom: 26px }
.cat-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; border-bottom: 2px solid var(--wood); padding-bottom: 6px }
.cat-head h2 { font: 500 21px var(--display); margin: 0; flex: 1 1 200px; min-width: 0; display: flex; align-items: center }
.cat-head .tot { margin-left: auto }
/* Category names edit in place: they read as headings until hovered or focused */
.cat-name { font: inherit; letter-spacing: inherit; color: inherit; background: none; border-color: transparent; padding: 2px 6px; margin-left: -6px }
.cat-name:hover { background: var(--field) }
.cat-name::placeholder { color: var(--muted) }
.cat-tools { display: flex; gap: 4px; align-items: center }
.cat-tools button { padding: 3px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: none }
.cat-tools button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted) }
.cat-tools .kind[aria-pressed="true"] { color: var(--good); border-color: color-mix(in srgb, var(--leaf) 50%, var(--line)) }
.cat-tools .cdel.arm { color: var(--bad); border-color: var(--bad) }
@media (hover: hover) {
  .cat-tools { opacity: 0; transition: opacity .15s }
  .cat-head:hover .cat-tools, .cat-head:focus-within .cat-tools, .cat-tools:has(.arm) { opacity: 1 }
}
.add-cat { display: block; margin: -8px 0 26px }
.cat-head .tot { font: 500 15px var(--mono); font-variant-numeric: tabular-nums }
.cat-head .tot small { color: var(--muted); font-size: 12px }
.chip { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--good); background: color-mix(in srgb, var(--leaf) 18%, transparent); border-radius: 99px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px }

.row { display: grid; grid-template-columns: minmax(0, 1fr) 112px 78px 92px 96px 30px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line) }
.row.labels { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 6px 0 4px }
.row.labels span:nth-child(5) { text-align: right }
.who-cell { display: grid; gap: 4px; min-width: 0 }
.who-pct { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap }
.who-pct input { width: 64px; padding: 3px 6px; font-size: 12.5px }
.who-rest { font-size: 11.5px; color: var(--muted); line-height: 1.2 }
.name-cell { min-width: 0; display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 4px; align-items: center }
.name-cell small { grid-column: 2 }
.grip { cursor: grab; color: var(--muted); opacity: .45; font-size: 15px; line-height: 1; text-align: center; user-select: none; -webkit-user-select: none; border-radius: 4px; padding: 4px 0 }
.row:hover .grip, .grip:focus-visible { opacity: 1; color: var(--pool) }
.grip:active { cursor: grabbing }
.row.dragging { opacity: .35 }
.row.drop-before { box-shadow: inset 0 3px 0 var(--pool) }
.row.drop-after { box-shadow: inset 0 -3px 0 var(--pool) }
section.cat.drop-into { outline: 2px dashed var(--pool); outline-offset: 6px; border-radius: var(--r-sm) }
.row.labels span:first-child { padding-left: 22px }
.name-cell small { display: block; color: var(--muted); font-size: 12px; padding-left: 8px; line-height: 1.3 }
input, select { font: 14px var(--body); color: var(--ink); background: var(--field); border: 1.5px solid transparent; border-radius: var(--r-sm); padding: 6px 8px; width: 100%; min-width: 0 }
input:hover, select:hover { border-color: var(--line) }
input:focus, select:focus { border-color: var(--pool); outline: none }
input.amt { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums }
.per-fixed { font-size: 12px; color: var(--muted); line-height: 1.25 }
.row.calc .name-cell small { color: var(--pool) }
.mo { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums }
.del { border: none; background: none; color: var(--muted); padding: 4px; font-size: 18px; line-height: 1 }
.del:hover { color: var(--bad) }
.add { margin-top: 10px; border-style: dashed; font-weight: 500; color: var(--muted); font-size: 13px; padding: 6px 12px }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr 1fr 1fr 30px; row-gap: 6px }
  .row .name-cell { grid-column: 1 / -1 }
  .row .mo { grid-column: 1 / -2; text-align: left; font-size: 13px; color: var(--muted) }
  .row .mo::before { content: "Monthly: " }
  .row.labels { display: none }
}

.bars { display: grid; gap: 9px }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 13px }
.bar-row .amt { font-family: var(--mono); font-variant-numeric: tabular-nums }
.track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden }
.fill { height: 100%; background: var(--leaf); border-radius: 3px }
.split { display: grid; gap: 8px; font-size: 14px }
.split div { display: flex; justify-content: space-between }
.split span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease } }
.mort { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; margin-bottom: 26px }
.mort-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 12px }
.mort-grid .wide { grid-column: 1 / -1 }
@media (max-width: 640px) { .mort-grid { grid-template-columns: 1fr 1fr } .mort-grid .fld:first-child { grid-column: 1 / -1 } }
.lbl-sm { font-size: 13px; color: var(--muted); margin-bottom: 4px }
.lbl-sm strong { color: var(--ink); font: 500 14px var(--mono) }
.fld label { display: block; font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 4px }
.dp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.dp-head strong { font: 500 15px var(--mono); font-variant-numeric: tabular-nums }
.dp-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 30px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line) }
.dp-add { margin-top: 8px }
@media (max-width: 640px) { .dp-row { grid-template-columns: minmax(0, 1fr) 100px 30px } }
.dp-empty { font-size: 13px; color: var(--muted); margin: 6px 0 0 }
input[type=range] { accent-color: var(--pool); padding: 0; background: none; border: none; flex: 1 }
.mort-out { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line) }
.mort-out .big { font: 400 30px/1.1 var(--serif); font-variant-numeric: tabular-nums }
.mort-out .big small { font: 13px var(--body); color: var(--muted) }
.mort-out .fine { font-size: 12.5px; color: var(--muted); margin-top: 4px }
.split-range { display: grid; gap: 10px }
.split-range .ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600 }
.split-range input { width: 100% }
.split-who { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px }
.split-who > div { background: var(--field); border-radius: var(--r-sm); padding: 10px 12px }
.split-who .nm { font: 600 11px var(--display); color: var(--muted); text-transform: uppercase; letter-spacing: .12em }
.split-who > div:first-child { box-shadow: inset 3px 0 0 var(--pool) } .split-who > div:last-child { box-shadow: inset 3px 0 0 var(--bloom) }
.split-who .amt { font: 400 19px var(--serif); font-variant-numeric: tabular-nums }
.split-who .yr { font: 12px var(--mono); color: var(--muted) }
.split-foot { font-size: 12.5px; color: var(--muted); margin: 6px 0 0 }
.v-save { display: flex; gap: 8px }
.v-save input { background: var(--field); border-color: var(--line) }
.v-save button { flex: none }
.v-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px }
.v-item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center }
.v-item.on { border-color: var(--pool); background: var(--accent-soft) }
.v-name { font-weight: 600; overflow-wrap: anywhere }
.v-meta { grid-column: 1 / -1; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.v-acts { grid-column: 2; grid-row: 1; display: flex; gap: 4px }
.v-acts button { padding: 5px 9px; font-size: 12.5px }
.v-acts .v-del { color: var(--muted) }
.v-acts .v-del.arm { color: var(--bad); border-color: var(--bad) }
.v-empty { font-size: 13px; color: var(--muted); margin: 10px 0 0 }
.v-save.with-tag { display: grid; grid-template-columns: minmax(0, 1fr) auto }
.v-save.with-tag #v-name { grid-column: 1 / -1 }
.v-tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px }
.tagchip { font: 600 10.5px var(--mono); color: var(--pool); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px }
.t-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.t-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center }
.t-item select { background: var(--field) }
.t-item .v-meta { grid-column: 1 / -1 }
.t-item .t-del { padding: 4px 9px; font-size: 12px; color: var(--muted) }
.t-item .t-del.arm { color: var(--bad); border-color: var(--bad) }
/* Version editor: one stacked column (it replaces the row's two-column layout) */
.v-edit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; border-color: var(--pool); padding: 12px }
.v-edit .v-lbl { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-top: 6px }
.v-edit .v-lbl:first-child { margin-top: 0 }
.v-edit input, .v-edit select { width: 100%; font: 14px var(--body); background: var(--field); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px }
.v-edit button { white-space: nowrap }
.ve-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px }
.ve-tags .tagchip { display: inline-flex; align-items: center; gap: 2px; text-transform: none }
.ve-tags .tagchip button { border: 0; background: none; padding: 0 2px; font-size: 13px; line-height: 1; color: inherit }
.ve-none { font-size: 12.5px; color: var(--muted) }
.ve-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px }
.ve-add button { padding: 5px 12px; font-size: 12.5px }
.ve-hint { font-size: 12px; color: var(--muted); margin: 0 }
.ve-acts { display: flex; gap: 6px; margin-top: 8px }
.ve-acts button { padding: 6px 16px; font-size: 13px }
.ve-replace { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; display: grid; gap: 2px; justify-items: start }
.ve-replace button { border: 0; background: none; padding: 0; font-size: 13px; color: var(--pool); text-decoration: underline; text-underline-offset: 2px }
.ve-replace button.arm { color: var(--bad); text-decoration: none; font-weight: 700 }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -8px 0 22px }
.resume span { flex: 1 1 260px }
.resume button { padding: 5px 12px; font-size: 13px }
.resume button.arm { color: var(--bad); border-color: var(--bad) }
.cur .v-update { margin-left: 6px; padding: 3px 10px; font-size: 12px }
.cur { font-size: 12.5px; color: var(--muted); margin: 8px 0 0 }
.cur strong { color: var(--ink) }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: 20px 0 24px; overflow-x: auto }
.tab { border: 0; border-radius: 0; background: none; padding: 10px 18px 12px; font: 500 17px var(--display); color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px }
.tab:hover { color: var(--ink) }
.tab[aria-selected="true"] { color: var(--ink) }
.tab-shared[aria-selected="true"] { border-bottom-color: var(--leaf) }
.tab-luke[aria-selected="true"] { border-bottom-color: var(--pool) }
.tab-amber[aria-selected="true"] { border-bottom-color: var(--bloom) }
.row.prow { grid-template-columns: minmax(0, 1fr) 112px 78px 96px 30px }
.amt-ro { font: 500 14px var(--mono); text-align: right; padding: 6px 8px; font-variant-numeric: tabular-nums }
.calc-note { color: var(--pool) !important }
.empty { font-size: 13.5px; color: var(--muted); margin: 10px 0 0 }
.gate { max-width: 460px; margin: 12vh auto 0; display: grid; gap: 14px; justify-items: start }
.gate .note { margin: 0 }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none }
.home-link:hover { color: var(--pool) }
@media (max-width: 640px) {
  .row.prow { grid-template-columns: 1fr 1fr 30px }
  .row.prow .mo { grid-column: 1 / -2 }
}
</style>

<div id="app"></div>
<script src="family-auth.js"></script>
<script id="app-js">
(function () {
  // Paid by: Shared items are pooled and divided by the global split; Split items say how much Luke
  // pays per month and Amber pays the rest
  var WHO = ["Shared", "Split"];
  var PEOPLE = ["Luke", "Amber"];
  // Common budgeting rule of thumb: homeowners insurance runs about 0.5% of home value per year
  var INSURANCE_PCT = 0.5;
  var TKEY = "luke-amber-budget-tab";
  var confirmReset = false, armedDel = null;

  // Three independent budgets ("docs"), each saved on its own: the open tab's name is its doc key.
  // revs guard against overwriting someone else's edit. tags name saved Shared versions; each
  // personal doc follows a tag, and its share of costs comes from the version that tag points to.
  var DOCS = ["shared", "Luke", "Amber"];
  var cfg, docs = {}, revs = {}, versions = { shared: [], Luke: [], Amber: [] }, tags = { shared: [], Luke: [], Amber: [] };
  // Tabs that kept unsaved work on open instead of switching to their default version
  var resumed = {};
  function label(doc) { return doc === "shared" ? "Shared" : doc + "’s budget"; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  var app = document.getElementById("app");
  var money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  var tab = "shared";

  function normalizeShared(d) {
    delete d.income; delete d.people;
    d.categories = d.categories || [];
    var m = d.mortgage = d.mortgage || {};
    if (typeof m.price !== "number") m.price = 0;
    if (typeof m.down !== "number") m.down = typeof m.loan === "number" ? Math.max(0, m.price - m.loan) : 0;
    if (typeof m.rate !== "number") m.rate = 6.25;
    if (typeof m.years !== "number") m.years = 30;
    delete m.loan;
    // The down payment is the sum of its sources. Older budgets had one number: it becomes one source.
    if (!Array.isArray(m.downItems)) m.downItems = m.down > 0 ? [{ id: "dp1", name: "Down payment", amount: m.down }] : [];
    m.down = downTotal(m);
    if (typeof d.split !== "number") d.split = 50;
    // Homeowners insurance and property tax follow the home value
    d.categories.forEach(function (c) { c.items.forEach(function (it) {
      delete it.split;
      // Luke's part of a Split item is per month (lukeMonthly). Briefly it was in the item's own period (luke).
      if (typeof it.luke === "number" && typeof it.lukeMonthly !== "number") it.lukeMonthly = cents(it.freq === "yr" ? it.luke / 12 : it.luke);
      delete it.luke;
      if (it.who === "Luke" || it.who === "Amber") { it.lukeMonthly = it.who === "Luke" ? cents(itemMonthly(it, m.price)) : 0; it.who = "Split"; }
      if (it.who !== "Split") { it.who = "Shared"; delete it.lukeMonthly; }
      else if (typeof it.lukeMonthly !== "number") it.lukeMonthly = Math.round(itemMonthly(it, m.price) * d.split / 100);
      // 0.383 was the earlier conversion of $2,300; move it to the standard default
      if (it.calc === "pctHome" && Math.abs(it.rate - 0.383) < 0.0005) it.rate = INSURANCE_PCT;
      if (it.calc) return;

      var rdoc = tab;
      fetchDefaults().then(function (d) {
        docs[rdoc] = d[rdoc]; persist(true, rdoc); render(); setStatus("Reset " + label(rdoc) + " to its starting numbers");
      }).catch(function () { setStatus("Couldn’t load the starting numbers. Try again."); });
    } else if (t.dataset.vedit) {
      editing = t.dataset.vedit; renderVersions();
      var ne = document.getElementById("ve-name"); if (ne) { ne.focus(); ne.select(); }
    } else if (t.dataset.vdone != null) {
      editing = null; renderVersions();
    } else if (t.dataset.vsave) {
      saveVersionDetails(tab, t.dataset.vsave);
    } else if (t.dataset.vaddtag) {
      addTag(t.dataset.vaddtag);
    } else if (t.dataset.vuntag) {
      deleteTag(tab, t.dataset.vuntag);
    } else if (t.dataset.vreplace) {
      var rid = t.dataset.vreplace, fans = tab === "shared" ? followersOf(rid) : [];
      if (armedDel !== "replace:" + rid) {
        armedDel = "replace:" + rid; t.classList.add("arm");
        t.textContent = fans.length ? "Replace? " + fans.join(" & ") + (fans.length > 1 ? " follow it" : " follows it") : "Click again to replace";
        setTimeout(function () { if (armedDel === "replace:" + rid) { armedDel = null; t.textContent = "Replace with current numbers"; t.classList.remove("arm"); } }, 3000);
        return;
      }
      armedDel = null; replaceNumbers(tab, rid);
    } else if (t.id === "v-update") {
      replaceNumbers(tab, t.dataset.vid);
    } else if (t.id === "resume-keep") {
      delete resumed[tab]; render();
    } else if (t.id === "resume-default") {
      if (armedDel !== "resume") {
        armedDel = "resume"; t.textContent = "Click again to discard"; t.classList.add("arm");
        setTimeout(function () { if (armedDel === "resume") { armedDel = null; t.textContent = "Discard and load default"; t.classList.remove("arm"); } }, 3000);
        return;
      }
      armedDel = null;
      var dt = tagFor(tab, "default"), dv = dt && versionIn(tab, dt.versionId);
      if (dv) { loadVersion(tab, dv); render(); setStatus("Loaded the default, “" + dv.name + "”"); }
    } else if (t.dataset.tagdel) {
      var tn = t.dataset.tagdel;
      if (armedDel !== "tag:" + tn) {
        armedDel = "tag:" + tn; t.textContent = "Confirm"; t.classList.add("arm");
        setTimeout(function () { if (armedDel === "tag:" + tn) { armedDel = null; t.textContent = "Delete"; t.classList.remove("arm"); } }, 3000);
        return;
      }
      armedDel = null;
      deleteTag(tab, tn);
    } else if (t.id === "signout") {
      flush(); FamilyAuth.logout();
    }
  });
  // Drag and drop: rows move within or between the sections of the current tab
  function locate(id) {
    var lists = allLists();
    for (var i = 0; i < lists.length; i++) for (var j = 0; j < lists[i].length; j++) if (lists[i][j].id === id) return { list: lists[i], index: j };
  }
  function tabKeys() { return tab === "shared" ? docs.shared.categories.map(function (c) { return c.id; }) : ["inc-" + tab].concat(docs[tab].categories.map(function (c) { return c.id; })); }
  function moveItem(id, key, beforeId) {
    var from = locate(id), to = findList(key); if (!from || !to) return false;
    var it = from.list[from.index];
    if (key.indexOf("inc-") === 0 && it.calc) return false;
    from.list.splice(from.index, 1);
    var at = beforeId ? to.findIndex(function (x) { return x.id === beforeId; }) : -1;
    to.splice(at < 0 ? to.length : at, 0, it);
    return true;
  }
  var dragId = null;
  function clearMarks() { app.querySelectorAll(".drop-before,.drop-after,.drop-into,.dragging").forEach(function (el) { el.classList.remove("drop-before", "drop-after", "drop-into", "dragging"); }); }
  function dropTarget(e) {
    var sec = e.target.closest && e.target.closest("section.cat"); if (!sec) return null;
    var row = e.target.closest(".row[data-id]");
    if (row && row.dataset.id !== dragId) {
      var r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
      var next = after ? row.nextElementSibling : row;
      if (next && next.dataset && next.dataset.id === dragId) next = next.nextElementSibling;
      if (next && !next.matches(".row[data-id]")) next = null;
      return { sec: sec, row: row, after: after, key: sec.dataset.cat, beforeId: next ? next.dataset.id : null };
    }
    return { sec: sec, key: sec.dataset.cat, beforeId: null };
  }
  app.addEventListener("dragstart", function (e) {
    var g = e.target.closest && e.target.closest(".grip"); if (!g) return;
    dragId = g.dataset.grip;
    var row = g.closest(".row");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.setDragImage(row, 24, 20); } catch (err) {}
    setTimeout(function () { row.classList.add("dragging"); }, 0);
  });
  app.addEventListener("dragover", function (e) {
    if (!dragId) return;
    var t = dropTarget(e); if (!t) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    app.querySelectorAll(".drop-before,.drop-after,.drop-into").forEach(function (el) { el.classList.remove("drop-before", "drop-after", "drop-into"); });
    if (t.row) t.row.classList.add(t.after ? "drop-after" : "drop-before"); else t.sec.classList.add("drop-into");
  });
  app.addEventListener("drop", function (e) {
    if (!dragId) return;
    var t = dropTarget(e); e.preventDefault();
    var id = dragId; dragId = null; clearMarks();
    if (t && moveItem(id, t.key, t.beforeId)) { persist(); render(); }
  });
  app.addEventListener("dragend", function () { dragId = null; clearMarks(); });

  app.addEventListener("keydown", function (e) {
    var g = e.target.closest && e.target.closest(".grip");
    if (g && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      e.preventDefault();
      var id = g.dataset.grip, loc = locate(id), keys = tabKeys(), up = e.key === "ArrowUp";
      var key = keys.filter(function (k) { return findList(k) === loc.list; })[0], ki = keys.indexOf(key);
      var moved = false;
      if (up && loc.index > 0) moved = moveItem(id, key, loc.list[loc.index - 1].id);
      else if (!up && loc.index < loc.list.length - 1) moved = moveItem(id, key, loc.list[loc.index + 2] ? loc.list[loc.index + 2].id : null);
      else for (var k = ki + (up ? -1 : 1); k >= 0 && k < keys.length && !moved; k += up ? -1 : 1) {
        var dest = findList(keys[k]);
        moved = moveItem(id, keys[k], up ? null : (dest[0] ? dest[0].id : null));
      }
      if (moved) { persist(); render(); var ng = app.querySelector('[data-grip="' + id + '"]'); if (ng) { ng.focus(); ng.scrollIntoView({ block: "nearest" }); } }
      return;
    }
    if (e.target.id === "v-name" && e.key === "Enter") { e.preventDefault(); saveVersion(); }
    if (e.target.id === "ve-name" && e.key === "Enter") { e.preventDefault(); saveVersionDetails(tab, e.target.closest("[data-veditor]").dataset.veditor); }
    if (e.target.id === "ve-tag" && e.key === "Enter") { e.preventDefault(); addTag(e.target.closest("[data-veditor]").dataset.veditor); }
    if (editing && e.key === "Escape" && e.target.closest && e.target.closest("[data-veditor]")) { editing = null; renderVersions(); }
    if (e.target.dataset && e.target.dataset.cname && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
    if (e.target.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      var order = ["shared", "Luke", "Amber"], i = order.indexOf(tab);
      setTab(order[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3]);
      var b = document.querySelector('[role="tab"][aria-selected="true"]'); if (b) b.focus();
    }
  });
  app.addEventListener("change", function (e) {
    if (e.target.id === "m-years") { docs.shared.mortgage.years = Number(e.target.value); totals(); persist(); return; }
    if (e.target.id === "ve-follow") { var fh = document.getElementById("ve-follow-hint"); if (fh) fh.textContent = followHint(e.target.value); return; }
    if (e.target.dataset.tagsel) {
      var tn = e.target.dataset.tagsel, vid = e.target.value, sdoc = tab, vv = versionIn(sdoc, vid);
      setTag(sdoc, tn, vid).then(function () {
        renderVersions(); setStatus(tn + " now points at “" + (vv ? vv.name : "") + "”" + (sdoc === "shared" ? followNote(tn) : "."));
      }).catch(function () { setStatus("Couldn’t move the tag. Try again."); renderVersions(); });
      return;
    }
  });

  var mode = "auto";
  function setMode(m) {
    mode = m;
    if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m);
    document.querySelectorAll(".mode button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
    try { localStorage.setItem("de-mode", m); } catch (e) {}
  }
  try { var storedMode = localStorage.getItem("de-mode"); if (storedMode) mode = storedMode; } catch (e) {}
  var fromHash = { "#shared": "shared", "#luke": "Luke", "#amber": "Amber" }[location.hash.toLowerCase()];
  try { tab = fromHash || localStorage.getItem(TKEY) || "shared"; } catch (e) { tab = fromHash || "shared"; }
  if (["shared", "Luke", "Amber"].indexOf(tab) < 0) tab = "shared";
  setMode(mode);

  // --- API -------------------------------------------------------------------
  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method, keepalive: method === "PUT" && /\/state$/.test(path),
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    });
  }
  // Starting numbers, already split into { shared, Luke, Amber }
  function fetchDefaults() {
    return api("GET", "/defaults").then(function (res) {
      if (res.status === 404) return splitCombined({});
      if (!res.ok) throw new Error(res.status);
      return res.json().then(function (d) { return splitCombined(d.state); });
    });
  }

  // Edits save about a second after the last change, per doc, so Shared, Luke and Amber never block
  // each other. Only one request per doc is in flight; a newer edit made meanwhile goes out right after.
  var sync = {};
  DOCS.forEach(function (d) { sync[d] = { timer: null, saving: false, dirty: false }; });
  function scheduleSave(doc) { var q = sync[doc]; q.dirty = true; clearTimeout(q.timer); q.timer = setTimeout(function () { flush(doc); }, 900); }
  function flush(doc) {
    if (!doc) { DOCS.forEach(function (d) { flush(d); }); return; }
    var q = sync[doc];
    clearTimeout(q.timer); q.timer = null;
    if (!q.dirty || q.saving) return;
    q.saving = true; q.dirty = false;
    var retry = false;
    api("PUT", "/docs/" + doc + "/state", { state: docs[doc], rev: revs[doc] }).then(function (res) {
      if (res.status === 409) return res.json().then(function (c) {
        revs[doc] = c.rev; docs[doc] = normalizeDoc(doc, c.state); q.dirty = false; render();
        setStatus(label(doc) + " was just changed somewhere else, so that version is loaded now.");
      });
      if (!res.ok) throw new Error(res.status);
      return res.json().then(function (r) { revs[doc] = r.rev; });
    }).catch(function () {
      q.dirty = retry = true;
      setStatus("Couldn’t save. Retrying in a few seconds…");
    }).then(function () {
      q.saving = false;
      if (retry) q.timer = setTimeout(function () { flush(doc); }, 5000); else if (q.dirty) scheduleSave(doc);
    });
  }
  // Pull in what the other person changed: tags, versions, and any doc with no local edits pending
  function refresh() {
    return api("GET", "/all").then(function (res) { return res.ok ? res.json() : null; }).then(function (all) {
      if (!all) return;
      tags = all.tags; versions = all.versions;
      DOCS.forEach(function (d) {
        var srv = all.docs[d], q = sync[d];
        if (srv && !q.dirty && !q.saving && srv.rev !== revs[d]) { docs[d] = normalizeDoc(d, srv.state); revs[d] = srv.rev; }
      });
      render();
    });
  }
  window.addEventListener("pagehide", function () { flush(); });
  window.addEventListener("focus", function () { if (docs.shared) refresh().catch(function () {}); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });

  function gate(msg, err) {
    app.innerHTML = '<div class="wrap"><div class="gate"><h1><span>Luke <em>&amp;</em> Amber’s Budget</span></h1>' +
      (err ? '<div class="note">' + esc(err) + "</div>" : '<p class="sub">' + msg + "</p>") +
      '<button class="primary" id="signin">Sign in</button><a class="home-link" href="https://dot-y.co/">← dot-y.co</a></div></div>';
    document.getElementById("signin").onclick = function () { FamilyAuth.login(); };
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account to open the budget.");
    return api("GET", "/all").then(function (res) {
      if (res.status === 403) return gate("", "Your account doesn’t have access to the budget. Ask Luke to add you.");
      if (!res.ok) throw new Error("Couldn’t load the budget (" + res.status + "). Reload to try again.");
      return res.json().then(function (all) {
        tags = all.tags; versions = all.versions;
        var missing = DOCS.filter(function (d) { return !all.docs[d]; });
        return (missing.length ? fetchDefaults() : Promise.resolve(null)).then(function (defs) {
          DOCS.forEach(function (d) {
            if (all.docs[d]) { docs[d] = normalizeDoc(d, all.docs[d].state); revs[d] = all.docs[d].rev; }
            else { docs[d] = defs[d]; revs[d] = null; }
          });
          openDefaults();
          render();
        });
      });
    });
  }).catch(function (e) { gate("", e.message); });
})();
</script>
</body>
