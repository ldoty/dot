<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Field Course</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap">
<style>
/* Layout: a therapist's clipboard — sticky module rail on the left (a strip on phones), one module "sheet" at a time on the right.
   Motif: primary-grade handwriting paper (solid top line, dashed midline, red baseline) and therapy-putty colors,
   which run soft → firm the same way the modules run easy → challenging. */
:root {
  --paper: #F4F7FB;
  --sheet: #FFFFFF;
  --ink: #1B2333;
  --muted: #586378;
  --hair: #DCE3EE;
  --rule: #7FA3D9;      /* handwriting-paper blue line */
  --margin: #DB4B53;    /* handwriting-paper red baseline */
  --accent: #2F63C0;
  --accent-ink: #FFFFFF;
  --tint: #EAF0FA;
  --good: #2F8A55;
  --good-tint: #E3F3E9;
  --bad: #B8433F;
  --bad-tint: #FBE7E6;
  /* putty, softest to firmest */
  --p1: #CDA978; --p2: #E9C43F; --p3: #D9534F; --p4: #3F9A62; --p5: #3C74D6; --p6: #26272C;
  --p6-edge: #26272C;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --f-hand: "Patrick Hand", "Comic Neue", "Chalkboard SE", cursive;

  --t-xs: 0.8125rem; --t-sm: 0.9375rem; --t-md: 1.0625rem; --t-lg: 1.375rem; --t-xl: 1.875rem; --t-2xl: clamp(2.1rem, 5vw, 3.4rem);
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--t-md); line-height: 1.6; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: var(--t-xl); font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: var(--t-lg); font-weight: 700; }
h4 { font-size: var(--t-md); font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.25rem; }
li + li { margin-top: 0.35rem; }
button { font: inherit; color: inherit; }

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 64px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .kicker { font-size: var(--t-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.brand .name { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; }
.putty-row { display: flex; align-items: center; gap: 10px; }
.putty-row .lbl { font-size: var(--t-xs); color: var(--muted); text-align: right; line-height: 1.3; }
.putties { display: flex; gap: 6px; }
.blob { width: 26px; height: 20px; border-radius: 48% 52% 45% 55% / 58% 50% 50% 42%; border: 2px dashed var(--hair); background: transparent; transition: background .3s, border-color .3s; }
.blob.on { border-style: solid; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; margin-top: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 18px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .group { font-size: var(--t-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 12px 0 4px 10px; }
.nav .group:first-child { margin-top: 0; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: var(--t-sm); color: var(--ink); }
.nav button:hover { background: var(--tint); }
.nav button[aria-current="page"] { background: var(--tint); font-weight: 700; }
.nav .dot { flex: none; width: 14px; height: 11px; border-radius: 48% 52% 45% 55% / 58% 50% 50% 42%; border: 2px solid var(--c, var(--hair)); background: transparent; }
.nav button.done .dot { background: var(--c); }
.nav .check { margin-left: auto; color: var(--good); font-weight: 700; font-size: var(--t-xs); }
.nav .plain { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: var(--t-xs); }

.skills { background: var(--sheet); border: 1px solid var(--hair); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.skills h4 { font-size: var(--t-sm); }
.skill-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; font-size: var(--t-xs); }
.bar { height: 8px; background: var(--tint); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s; }

/* ---------- pages ---------- */
main { min-width: 0; }
.page { background: var(--sheet); border: 1px solid var(--hair); border-radius: 16px; padding: clamp(20px, 4vw, 44px); display: flex; flex-direction: column; gap: 28px; }
.page > * { max-width: 72ch; }
.page > .wide { max-width: none; }

.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: var(--t-xs); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 99px; border: 1px solid var(--hair); letter-spacing: 0.04em; text-transform: none; font-weight: 700; color: var(--ink); }
.chip .dot { width: 14px; height: 11px; border-radius: 48% 52% 45% 55% / 58% 50% 50% 42%; background: var(--c); border: 2px solid var(--c); }

/* handwriting-paper title */
.lined { font-size: var(--t-2xl); font-weight: 800; letter-spacing: -0.015em; line-height: 1.5; }
.lined span {
  padding-inline: 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  background:
    linear-gradient(var(--rule), var(--rule)) 0 16% / 100% 2px no-repeat,
    repeating-linear-gradient(90deg, var(--rule) 0 9px, transparent 9px 16px) 0 38% / 100% 2px no-repeat,
    linear-gradient(var(--margin), var(--margin)) 0 79% / 100% 2px no-repeat;
}
.lede { font-size: 1.1875rem; line-height: 1.55; color: var(--ink); }
.big-idea { border-left: 4px solid var(--c, var(--accent)); padding: 4px 0 4px 16px; font-size: var(--t-lg); font-family: var(--f-display); font-weight: 600; line-height: 1.35; }

.block { display: flex; flex-direction: column; gap: 14px; }
.block-label { font-size: var(--t-xs); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.block-label::after { content: ""; flex: 1; height: 1px; background: var(--hair); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--hair); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h4 { font-size: var(--t-md); }
.card p { font-size: var(--t-sm); color: var(--muted); }

.note { background: var(--tint); border-radius: 12px; padding: 14px 16px; font-size: var(--t-sm); }
.note strong { font-family: var(--f-display); }

/* index-card style hands-on activity */
.tryit { border: 1px solid var(--hair); border-radius: 4px; background:
  linear-gradient(var(--margin), var(--margin)) 0 52px / 100% 2px no-repeat,
  repeating-linear-gradient(transparent 0 27px, var(--hair) 27px 28px) 0 54px / 100% calc(100% - 54px) no-repeat, var(--sheet);
  padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.tryit-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; min-height: 30px; }
.tryit-head h3 { font-size: var(--t-lg); }
.meta { font-size: var(--t-xs); color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
.tryit ol { line-height: 1.75; }
.tag-grown { display: inline-block; font-size: var(--t-xs); font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--tint); color: var(--accent); margin-left: 4px; }

.skillbox { border: 2px solid var(--ink); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.skillbox .block-label { color: var(--ink); }
.skillbox .block-label::after { background: var(--ink); opacity: .15; }

/* journal */
.reflect { display: flex; flex-direction: column; gap: 8px; }
.reflect label { font-weight: 700; }
.reflect .hint { font-size: var(--t-sm); color: var(--muted); }
textarea.jr {
  width: 100%; min-height: 140px; resize: vertical; border: 1px solid var(--hair); border-radius: 8px; padding: 6px 14px 6px 46px;
  font-family: var(--f-hand); font-size: 1.25rem; line-height: 32px; color: var(--ink);
  background:
    linear-gradient(90deg, transparent 34px, var(--margin) 34px, var(--margin) 36px, transparent 36px),
    repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px) 0 6px,
    var(--sheet);
  background-attachment: local;
}
textarea.jr.short { min-height: 76px; }
.saved { font-size: var(--t-xs); color: var(--muted); min-height: 1em; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 99px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; font-size: var(--t-sm); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.05); }
.btn.is-done { background: var(--good); border-color: var(--good); color: var(--sheet); }
.foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid var(--hair); }

/* quizzes */
.quiz { display: flex; flex-direction: column; gap: 10px; }
.q { border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.q .prompt { font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--hair); background: var(--sheet); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: var(--t-sm); font-weight: 700; }
.opt:hover { border-color: var(--accent); }
.opt.right { background: var(--good-tint); border-color: var(--good); color: var(--good); }
.opt.wrong { background: var(--bad-tint); border-color: var(--bad); color: var(--bad); }
.fb { font-size: var(--t-sm); color: var(--muted); }
.fb b { color: var(--ink); }
.score { font-size: var(--t-sm); font-weight: 700; color: var(--muted); }

/* order quiz */
.order { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order li { margin: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--hair); border-radius: 10px; padding: 8px 10px; }
.order li.right { border-color: var(--good); background: var(--good-tint); }
.order li.wrong { border-color: var(--bad); background: var(--bad-tint); }
.order .pos { font-family: var(--f-display); font-weight: 800; width: 1.6em; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.order .age { display: block; font-size: var(--t-xs); color: var(--muted); }
.order .mv { display: flex; gap: 4px; }
.order .mv button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--hair); background: var(--sheet); cursor: pointer; }
.order .mv button:disabled { opacity: .35; cursor: default; }

/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1.5px solid var(--hair); background: var(--sheet); border-radius: 99px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: var(--t-sm); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.setting { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; border: 1px solid var(--hair); border-radius: 12px; padding: 18px; }
.sched { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0; font-size: var(--t-sm); }
.sched li { margin: 0; display: grid; grid-template-columns: 4.6em 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--hair); }
.sched time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); }
.setting dl { margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: var(--t-sm); }
.setting dt { font-weight: 700; font-family: var(--f-display); }
.setting dd { margin: 0; color: var(--muted); }

/* grading machine */
.machine { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.machine label { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); font-weight: 700; }
select { font: inherit; font-size: var(--t-sm); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--hair); background: var(--sheet); color: var(--ink); width: 100%; }
.meter { position: relative; height: 18px; border-radius: 99px; display: grid; grid-template-columns: 2fr 3fr 6fr; overflow: hidden; border: 1px solid var(--hair); }
.meter span { display: block; }
.meter .z1 { background: var(--tint); }
.meter .z2 { background: var(--good-tint); border-inline: 2px solid var(--good); }
.meter .z3 { background: var(--bad-tint); }
.meter-wrap { position: relative; padding-top: 6px; }
.needle { position: absolute; top: 0; width: 4px; height: 30px; background: var(--ink); border-radius: 2px; transform: translateX(-2px); transition: left .35s; }
.meter-labels { display: grid; grid-template-columns: 2fr 3fr 6fr; font-size: var(--t-xs); color: var(--muted); margin-top: 6px; font-weight: 700; }
.meter-labels span:nth-child(2) { text-align: center; color: var(--good); }
.meter-labels span:nth-child(3) { text-align: right; }
.verdict { font-weight: 700; }

/* sensory sliders */
.senses { display: flex; flex-direction: column; gap: 10px; }
.sense { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.sense .nm { font-weight: 700; font-size: var(--t-sm); }
.sense .nm small { display: block; font-weight: 400; color: var(--muted); font-size: var(--t-xs); }
.sense input[type=range] { width: 100%; accent-color: var(--accent); }
.ends { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--muted); grid-column: 2; margin-top: -4px; }

/* table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--hair); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); min-width: 520px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font-family: var(--f-display); background: var(--tint); }
tr:last-child td { border-bottom: 0; }

/* timeline */
.timeline { list-style: none; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0; }
.timeline::before { content: ""; position: absolute; left: 47px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.timeline li { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; padding-bottom: 22px; position: relative; }
.timeline .when { text-align: center; position: relative; z-index: 1; }
.timeline .age { display: inline-block; background: var(--sheet); border: 2px solid var(--rule); border-radius: 99px; padding: 2px 10px; font-family: var(--f-display); font-weight: 800; font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.timeline .stage { font-size: var(--t-xs); color: var(--muted); margin-top: 4px; font-weight: 700; }
.timeline .what { display: flex; flex-direction: column; gap: 6px; }
.timeline .what p, .timeline .what li { font-size: var(--t-sm); }
.timeline li.now .age { background: var(--margin); border-color: var(--margin); color: #fff; }

/* glossary */
dl.gloss { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); margin: 0; border-top: 1px solid var(--hair); }
dl.gloss dt, dl.gloss dd { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: var(--t-sm); }
dl.gloss dt { font-weight: 700; padding-right: 14px; }
dl.gloss dd { color: var(--muted); }

.copybox { width: 100%; min-height: 220px; font-family: var(--f-body); font-size: var(--t-sm); border: 1px solid var(--hair); border-radius: 8px; padding: 12px; background: var(--paper); color: var(--ink); }
.journal-list { display: flex; flex-direction: column; gap: 14px; }
.journal-entry { border-bottom: 1px dashed var(--hair); padding-bottom: 12px; }
.journal-entry .q-lbl { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.journal-entry .ans { font-family: var(--f-hand); font-size: 1.3rem; line-height: 1.4; white-space: pre-wrap; }
.journal-entry .ans.empty { color: var(--muted); font-family: var(--f-body); font-size: var(--t-sm); font-style: italic; }

.case { border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; }
.case-head { background: var(--ink); color: var(--sheet); padding: 12px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-family: var(--f-display); font-weight: 700; }
.case-body { padding: 16px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; font-size: var(--t-sm); }
.case-body h4 { font-size: var(--t-sm); margin-bottom: 4px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px; scrollbar-width: thin; }
  .nav .group { display: none; }
  .nav button { width: auto; white-space: nowrap; border: 1px solid var(--hair); }
  .nav .check { display: none; }
  .skills { display: none; }
  .setting { grid-template-columns: minmax(0, 1fr); }
  .putty-row .lbl { text-align: left; }
}
@media (max-width: 520px) {
  .shell { padding-inline: 16px; }
  .sense { grid-template-columns: minmax(0, 1fr); }
  .ends { grid-column: 1; }
  dl.gloss { grid-template-columns: minmax(0, 1fr); }
  dl.gloss dt { border-bottom: 0; padding-bottom: 0; }
  .timeline::before { left: 31px; }
  .timeline li { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Sign-in gate, shown until the course loads */
.gate { max-width: 520px; margin: 18vh auto 0; padding: 0 16px; text-align: center; display: grid; gap: 14px; justify-items: center }
.gate h1 { font-family: var(--f-display); font-size: var(--t-xl) }
.gate p { color: var(--muted); margin: 0 }
.gate button { font: 700 var(--t-md) var(--f-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer }
</style>
</head>
<body>
<div id="course"><div class="gate"><h1>OT Field Course</h1><p id="gate-msg">Loading…</p></div></div>
<script src="family-auth.js"></script>
<script>
/* Signs in, then loads the course and your saved progress from the API and starts it.
   The course itself is served by the API so it isn't public. Progress is kept in this browser
   and saved to your account a moment after each change, so every device picks up where you left off. */
(function () {
  var KEY = "tempi-ot-course-v1", cfg, pending = null, timer = null, saving = false;
  function api(method, path, body) {
    return FamilyAuth.accessToken().then(function (tok) {
      if (!tok) { FamilyAuth.login(); return new Promise(function () {}); }
      return fetch(cfg.apiUrl + path, {
        method: method, keepalive: method === "PUT",
        headers: { authorization: "Bearer " + tok, "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
    });
  }
  function push() {
    clearTimeout(timer); timer = null;
    if (saving || !pending) return;
    var body = pending; pending = null; saving = true;
    var retry = false;
    api("PUT", "/progress", { progress: body }).then(function (res) {
      if (!res.ok) throw new Error(res.status);
    }).catch(function () { if (!pending) pending = body; retry = true; }).then(function () {
      saving = false;
      if (pending) timer = setTimeout(push, retry ? 5000 : 200);
    });
  }
  window.tempiSync = function (state) {
    pending = JSON.parse(JSON.stringify(state));
    clearTimeout(timer); timer = setTimeout(push, 1000);
  };
  window.addEventListener("pagehide", push);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") push(); });

  function gate(msg, signIn) {
    document.getElementById("gate-msg").textContent = msg;
    if (signIn && !document.getElementById("signin")) {
      var b = document.createElement("button"); b.id = "signin"; b.textContent = "Sign in";
      b.onclick = function () { FamilyAuth.login(); };
      document.querySelector(".gate").appendChild(b);
    }
  }

  fetch("config.json").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    return FamilyAuth.init(c);
  }).then(function (user) {
    if (!user) return FamilyAuth.autoLogin() || gate("Sign in with your family account.", true);
    return Promise.all([api("GET", "/course"), api("GET", "/progress")]).then(function (r) {
      if (r[0].status === 403) return gate("Your account doesn’t have access to this course.");

  function senseSummary() {
    var el = document.getElementById("senseSummary"), t = senseSummaryText();
    el.innerHTML = t ? "<strong>Your profile so far.</strong> " + t + " Neither is better. Knowing your profile helps you choose study spots, calm down and understand the kids you'll work with." : "<strong>Your profile so far.</strong> All sliders are in the middle. Move any slider to see your profile here.";
  }
  senseSummary();

  // ---------- boot ----------
  renderProgress();
  var h = (location.hash || "").slice(1);
  go(ids.indexOf(h) >= 0 ? h : (S.last && ids.indexOf(S.last) >= 0 ? S.last : "start"), true);
};
</script>
